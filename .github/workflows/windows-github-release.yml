name: Trusted Windows GitHub release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Exact immutable Windows release tag (windows-v1.5.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: aegis-trusted-windows-release
  cancel-in-progress: false

jobs:
  build-private-unsigned:
    name: Build unsigned bytes into the local build-to-signer boundary
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'lzy2767865503-pixel/aegis-forecast' &&
      github.repository_owner == 'lzy2767865503-pixel' &&
      github.actor == 'lzy2767865503-pixel' &&
      github.triggering_actor == 'lzy2767865503-pixel' &&
      github.ref == 'refs/heads/main'
    runs-on: [self-hosted, windows, x64, aegis-release-build]
    environment: windows-github-release
    timeout-minutes: 360
    permissions:
      contents: read
    outputs:
      source_commit: ${{ steps.private_handoff.outputs.source_commit }}
      handoff_leaf: ${{ steps.private_handoff.outputs.handoff_leaf }}
      input_tree_sha256: ${{ steps.private_handoff.outputs.input_tree_sha256 }}
    env:
      AEGIS_TRUSTED_GITHUB_BUILD: "1"
      RELEASE_TAG: ${{ inputs.release_tag }}
      APPROVED_TAG: ${{ vars.AEGIS_GITHUB_RELEASE_APPROVAL_TAG }}
      AEGIS_TAG_RULESET_ID: "21631608"
      AEGIS_MAIN_RULESET_ID: "21633557"
      AEGIS_PRIVATE_SIGNING_HANDOFF_ROOT: ${{ vars.AEGIS_PRIVATE_SIGNING_HANDOFF_ROOT }}
      AEGIS_RELEASE_BUILD_RUNNER_NAME: ${{ vars.AEGIS_RELEASE_BUILD_RUNNER_NAME }}
      AEGIS_RELEASE_SIGNER_RUNNER_NAME: ${{ vars.AEGIS_RELEASE_SIGNER_RUNNER_NAME }}
      AEGIS_RELEASE_BUILD_ACCOUNT_SID: ${{ vars.AEGIS_RELEASE_BUILD_ACCOUNT_SID }}
      AEGIS_RELEASE_SIGNER_ACCOUNT_SID: ${{ vars.AEGIS_RELEASE_SIGNER_ACCOUNT_SID }}
      ARCHIVE_NAME: QuantScenarioStudio-by-LAI-ZEYU-1.5.0-x64.zip
    steps:
      - name: Check out the exact selected immutable tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_tag }}
          persist-credentials: false

      - name: Require exact tag, protected main, separate build identity, and empty Release slot
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          Set-StrictMode -Version Latest
          if ($env:GITHUB_EVENT_NAME -cne 'workflow_dispatch' -or
              $env:GITHUB_REPOSITORY -cne 'lzy2767865503-pixel/aegis-forecast' -or
              $env:GITHUB_ACTOR -cne 'lzy2767865503-pixel' -or
              $env:GITHUB_TRIGGERING_ACTOR -cne 'lzy2767865503-pixel' -or
              $env:GITHUB_REF -cne 'refs/heads/main') {
            throw 'The trusted release accepts only an owner-dispatched or owner-rerun main workflow.'
          }
          if ($env:RELEASE_TAG -cne 'windows-v1.5.0' -or $env:APPROVED_TAG -cne $env:RELEASE_TAG) {
            throw 'The protected environment must approve exactly windows-v1.5.0.'
          }
          if ($env:RUNNER_NAME -cne $env:AEGIS_RELEASE_BUILD_RUNNER_NAME -or
              [string]::IsNullOrWhiteSpace($env:AEGIS_RELEASE_SIGNER_RUNNER_NAME) -or
              $env:AEGIS_RELEASE_BUILD_RUNNER_NAME -ceq $env:AEGIS_RELEASE_SIGNER_RUNNER_NAME -or
              $env:AEGIS_RELEASE_BUILD_ACCOUNT_SID -cnotmatch '^S-1-(?:\d+-){1,14}\d+$' -or
              $env:AEGIS_RELEASE_SIGNER_ACCOUNT_SID -cnotmatch '^S-1-(?:\d+-){1,14}\d+$' -or
              $env:AEGIS_RELEASE_BUILD_ACCOUNT_SID -ceq $env:AEGIS_RELEASE_SIGNER_ACCOUNT_SID -or
              [string]::IsNullOrWhiteSpace($env:AEGIS_PRIVATE_SIGNING_HANDOFF_ROOT)) {
            throw 'Protected build/sign runner names, separate account SIDs, and the private NTFS handoff root must be configured exactly.'
          }
          $Identity = [Security.Principal.WindowsIdentity]::GetCurrent()
          try {
            $CurrentSid = [string]$Identity.User.Value
            $BuildPrincipal = [Security.Principal.WindowsPrincipal]::new($Identity)
            $BuildIsAdministrator = $BuildPrincipal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)
          } finally { $Identity.Dispose() }
          if ($CurrentSid -cne $env:AEGIS_RELEASE_BUILD_ACCOUNT_SID -or $BuildIsAdministrator) {
            throw 'This job must run as the exact non-Administrators protected build account.'
          }
          if ($env:AEGIS_TAG_RULESET_ID -cne '21631608' -or $env:AEGIS_MAIN_RULESET_ID -cne '21633557') {
            throw 'A protected repository ruleset ID drifted.'
          }
          function Assert-Rulesets {
            $TagRuleset = & gh api "repos/$env:GITHUB_REPOSITORY/rulesets/$env:AEGIS_TAG_RULESET_ID" | ConvertFrom-Json
            $TagTypes = @($TagRuleset.rules | ForEach-Object type | Sort-Object)
            if ($LASTEXITCODE -ne 0 -or [long]$TagRuleset.id -ne 21631608 -or $TagRuleset.enforcement -cne 'active' -or
                $TagRuleset.target -cne 'tag' -or @($TagRuleset.bypass_actors).Count -ne 0 -or
                (@($TagRuleset.conditions.ref_name.include) -join '|') -cne 'refs/tags/windows-v*' -or
                @($TagRuleset.conditions.ref_name.exclude).Count -ne 0 -or ($TagTypes -join '|') -cne 'deletion|update') {
              throw 'The active no-bypass Windows tag update/deletion ruleset is not exact.'
            }
            $MainRuleset = & gh api "repos/$env:GITHUB_REPOSITORY/rulesets/$env:AEGIS_MAIN_RULESET_ID" | ConvertFrom-Json
            $MainTypes = @($MainRuleset.rules | ForEach-Object type | Sort-Object)
            $PullRules = @($MainRuleset.rules | Where-Object type -ceq 'pull_request')
            $StatusRules = @($MainRuleset.rules | Where-Object type -ceq 'required_status_checks')
            if ($LASTEXITCODE -ne 0 -or [long]$MainRuleset.id -ne 21633557 -or $MainRuleset.enforcement -cne 'active' -or
                $MainRuleset.target -cne 'branch' -or @($MainRuleset.bypass_actors).Count -ne 0 -or
                (@($MainRuleset.conditions.ref_name.include) -join '|') -cne 'refs/heads/main' -or
                @($MainRuleset.conditions.ref_name.exclude).Count -ne 0 -or
                ($MainTypes -join '|') -cne 'deletion|non_fast_forward|pull_request|required_status_checks' -or
                $PullRules.Count -ne 1 -or $StatusRules.Count -ne 1) {
              throw 'The active no-bypass protected-main lineage ruleset is not exact.'
            }
            $Parameters = $PullRules[0].parameters
            $ParameterKeys = @($Parameters.PSObject.Properties.Name | Sort-Object)
            $ExpectedKeys = @('allowed_merge_methods', 'dismiss_stale_reviews_on_push', 'require_code_owner_review', 'require_extra_approval_for_unattributed_changes', 'require_last_push_approval', 'required_approving_review_count', 'required_review_thread_resolution', 'required_reviewers') | Sort-Object
            if (($ParameterKeys -join '|') -cne ($ExpectedKeys -join '|') -or
                (@($Parameters.allowed_merge_methods | Sort-Object) -join '|') -cne 'merge|rebase|squash' -or
                -not $Parameters.dismiss_stale_reviews_on_push -or -not $Parameters.required_review_thread_resolution -or
                $Parameters.require_code_owner_review -or $Parameters.require_extra_approval_for_unattributed_changes -or
                $Parameters.require_last_push_approval -or [int]$Parameters.required_approving_review_count -ne 0 -or
                @($Parameters.required_reviewers).Count -ne 0) {
              throw 'The exact main pull-request/review-thread-resolution policy drifted.'
            }
            $StatusParameters = $StatusRules[0].parameters
            $StatusKeys = @($StatusParameters.PSObject.Properties.Name | Sort-Object)
            $ExpectedStatusKeys = @('do_not_enforce_on_create', 'required_status_checks', 'strict_required_status_checks_policy') | Sort-Object
            $Checks = @($StatusParameters.required_status_checks)
            $Contexts = @($Checks | ForEach-Object { [string]$_.context } | Sort-Object)
            if (($StatusKeys -join '|') -cne ($ExpectedStatusKeys -join '|') -or
                -not $StatusParameters.strict_required_status_checks_policy -or $StatusParameters.do_not_enforce_on_create -or
                $Checks.Count -ne 2 -or ($Contexts -join '|') -cne 'verify (3.10)|verify (3.12)' -or
                @($Checks | Where-Object { [long]$_.integration_id -ne 15368 }).Count -ne 0 -or
                @($Checks | Where-Object { (@($_.PSObject.Properties.Name | Sort-Object) -join '|') -cne 'context|integration_id' }).Count -ne 0) {
              throw 'The exact strict GitHub Actions required-status-check policy drifted.'
            }
          }
          Assert-Rulesets
          & git fetch --force origin "refs/tags/$($env:RELEASE_TAG):refs/tags/$($env:RELEASE_TAG)"
          & git fetch --force origin 'refs/heads/main:refs/remotes/origin/main'
          $HeadCommit = (& git rev-parse HEAD).Trim().ToLowerInvariant()
          $LocalTagCommit = (& git rev-parse "$($env:RELEASE_TAG)^{}").Trim().ToLowerInvariant()
          $MainCommit = (& git rev-parse refs/remotes/origin/main).Trim().ToLowerInvariant()
          $RemoteLines = @(& git ls-remote --exit-code --tags origin "refs/tags/$($env:RELEASE_TAG)" "refs/tags/$($env:RELEASE_TAG)^{}")
          $Peeled = @($RemoteLines | Where-Object { $_ -match "refs/tags/$([Regex]::Escape($env:RELEASE_TAG))\^\{\}$" })
          $Direct = @($RemoteLines | Where-Object { $_ -match "refs/tags/$([Regex]::Escape($env:RELEASE_TAG))$" })
          $RemoteTagCommit = if ($Peeled.Count -eq 1) { ($Peeled[0] -split '\s+')[0].ToLowerInvariant() } elseif ($Peeled.Count -eq 0 -and $Direct.Count -eq 1) { ($Direct[0] -split '\s+')[0].ToLowerInvariant() } else { throw 'Remote release tag is missing or ambiguous.' }
          if ($HeadCommit -cnotmatch '^[0-9a-f]{40}$' -or $HeadCommit -cne $LocalTagCommit -or
              $HeadCommit -cne $RemoteTagCommit -or $HeadCommit -cne $MainCommit) {
            throw 'HEAD, immutable tag, remote tag, and protected main must identify one exact commit.'
          }
          "SELECTED_RELEASE_COMMIT=$HeadCommit" >> $env:GITHUB_ENV
          $PSNativeCommandUseErrorActionPreference = $false
          $Probe = @(& gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$env:RELEASE_TAG" 2>&1)
          $ProbeExit = $LASTEXITCODE
          $PSNativeCommandUseErrorActionPreference = $true
          if ($ProbeExit -eq 0 -or ($Probe -join "`n") -notmatch '(?i)\bHTTP\s+404\b') {
            throw 'The GitHub Release slot is not provably empty.'
          }

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: 3.13.14
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-windows-build.lock.txt
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.34.5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.23.1
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 8.0.424

      - name: Run source, audit, frontend, and frozen-sidecar gates
        shell: pwsh
        run: |
          ./scripts/windows/setup.ps1
          ./scripts/windows/verify-pass1.ps1

      - name: Build private portable staging once
        shell: pwsh
        run: ./scripts/windows/build-github-portable.ps1 -OutputRoot artifacts/github-release/portable

      - name: Atomically retain only the unsigned input in the local exact-ACL signer handoff
        id: private_handoff
        shell: pwsh
        run: >-
          ./scripts/windows/retain-private-signing-handoff.ps1
          -PrivateRoot $env:AEGIS_PRIVATE_SIGNING_HANDOFF_ROOT
          -BuildAccountSid $env:AEGIS_RELEASE_BUILD_ACCOUNT_SID
          -SignerAccountSid $env:AEGIS_RELEASE_SIGNER_ACCOUNT_SID
          -ExpectedBuildRunnerName $env:AEGIS_RELEASE_BUILD_RUNNER_NAME
          -ExpectedSignerRunnerName $env:AEGIS_RELEASE_SIGNER_RUNNER_NAME

      - name: Remove all private build work products after handoff
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          Set-StrictMode -Version Latest
          $Errors = [Collections.Generic.List[string]]::new()
          foreach ($Relative in @('artifacts/github-release', 'artifacts/backend', 'artifacts/pyinstaller', 'artifacts/test-logs')) {
            try {
              $Target = [IO.Path]::GetFullPath((Join-Path $PWD $Relative)).TrimEnd('\')
              $Artifacts = [IO.Path]::GetFullPath((Join-Path $PWD 'artifacts')).TrimEnd('\') + '\'
              if (-not $Target.StartsWith($Artifacts, [StringComparison]::OrdinalIgnoreCase)) { throw 'target escaped artifacts' }
              if (Test-Path -LiteralPath $Target) {
                $Item = Get-Item -LiteralPath $Target -Force
                $Reparse = @(Get-ChildItem -LiteralPath $Target -Force -Recurse -ErrorAction Stop | Where-Object { ($_.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0 })
                if (($Item.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0 -or $Reparse.Count -ne 0) { throw 'cleanup tree contains a reparse point' }
                Remove-Item -LiteralPath $Target -Recurse -Force -ErrorAction Stop
              }
              if (Test-Path -LiteralPath $Target) { throw 'cleanup target remained' }
            } catch { $Errors.Add("$Relative`: $($_.Exception.Message)") }
          }
          if ($Errors.Count -ne 0) { throw "Release work-product cleanup failed: $($Errors -join ' | ')" }

  sign-private-no-checkout:
    name: No-checkout isolated signer on the separate protected account
    needs: build-private-unsigned
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'lzy2767865503-pixel/aegis-forecast' &&
      github.repository_owner == 'lzy2767865503-pixel' &&
      github.actor == 'lzy2767865503-pixel' &&
      github.triggering_actor == 'lzy2767865503-pixel' &&
      github.ref == 'refs/heads/main'
    runs-on: [self-hosted, windows, x64, aegis-release-signer]
    environment: windows-github-release
    timeout-minutes: 180
    permissions:
      contents: read
    outputs:
      archive_name: ${{ steps.signed_metadata.outputs.archive_name }}
      archive_sha256: ${{ steps.signed_metadata.outputs.archive_sha256 }}
      checksum_sha256: ${{ steps.signed_metadata.outputs.checksum_sha256 }}
      signer_thumbprint: ${{ steps.signed_metadata.outputs.signer_thumbprint }}
      archive_entry_count: ${{ steps.signed_metadata.outputs.archive_entry_count }}
      archive_file_count: ${{ steps.signed_metadata.outputs.archive_file_count }}
      archive_expanded_size: ${{ steps.signed_metadata.outputs.archive_expanded_size }}
      archive_inventory_sha256: ${{ steps.signed_metadata.outputs.archive_inventory_sha256 }}
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
      SOURCE_COMMIT: ${{ needs.build-private-unsigned.outputs.source_commit }}
      HANDOFF_LEAF: ${{ needs.build-private-unsigned.outputs.handoff_leaf }}
      INPUT_TREE_SHA256: ${{ needs.build-private-unsigned.outputs.input_tree_sha256 }}
      ARCHIVE_NAME: QuantScenarioStudio-by-LAI-ZEYU-1.5.0-x64.zip
      AEGIS_PRIVATE_SIGNING_HANDOFF_ROOT: ${{ vars.AEGIS_PRIVATE_SIGNING_HANDOFF_ROOT }}
      AEGIS_RELEASE_BUILD_RUNNER_NAME: ${{ vars.AEGIS_RELEASE_BUILD_RUNNER_NAME }}
      AEGIS_RELEASE_SIGNER_RUNNER_NAME: ${{ vars.AEGIS_RELEASE_SIGNER_RUNNER_NAME }}
      AEGIS_RELEASE_BUILD_ACCOUNT_SID: ${{ vars.AEGIS_RELEASE_BUILD_ACCOUNT_SID }}
      AEGIS_RELEASE_SIGNER_ACCOUNT_SID: ${{ vars.AEGIS_RELEASE_SIGNER_ACCOUNT_SID }}
      AEGIS_TRUSTED_SIGNER_ORCHESTRATOR_PATH: ${{ vars.AEGIS_TRUSTED_SIGNER_ORCHESTRATOR_PATH }}
      AEGIS_TRUSTED_SIGNER_ORCHESTRATOR_SHA256: ${{ vars.AEGIS_TRUSTED_SIGNER_ORCHESTRATOR_SHA256 }}
      AEGIS_TRUSTED_SIGNER_ORCHESTRATOR_SIGNER_THUMBPRINT: ${{ vars.AEGIS_TRUSTED_SIGNER_ORCHESTRATOR_SIGNER_THUMBPRINT }}
      AEGIS_ESIGNER_CREDENTIAL_TRANSPORT: ${{ vars.AEGIS_ESIGNER_CREDENTIAL_TRANSPORT }}
    steps:
      # Deliberately no checkout and no downloaded action before the only secret-bearing step.
      - name: Verify the no-checkout account, exact ACL handoff, and out-of-band signer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          Set-StrictMode -Version Latest
          if ($env:RUNNER_NAME -cne $env:AEGIS_RELEASE_SIGNER_RUNNER_NAME -or
              $env:AEGIS_RELEASE_BUILD_RUNNER_NAME -ceq $env:AEGIS_RELEASE_SIGNER_RUNNER_NAME -or
              $env:AEGIS_RELEASE_BUILD_ACCOUNT_SID -cnotmatch '^S-1-(?:\d+-){1,14}\d+$' -or
              $env:AEGIS_RELEASE_SIGNER_ACCOUNT_SID -cnotmatch '^S-1-(?:\d+-){1,14}\d+$' -or
              $env:AEGIS_RELEASE_BUILD_ACCOUNT_SID -ceq $env:AEGIS_RELEASE_SIGNER_ACCOUNT_SID -or
              $env:SOURCE_COMMIT -cnotmatch '^[0-9a-f]{40}$' -or $env:INPUT_TREE_SHA256 -cnotmatch '^[0-9a-f]{64}$' -or
              $env:RELEASE_TAG -cne 'windows-v1.5.0' -or $env:ARCHIVE_NAME -cne 'QuantScenarioStudio-by-LAI-ZEYU-1.5.0-x64.zip' -or
              $env:HANDOFF_LEAF -cnotmatch '^aegis-github-1\.5\.0-\d+-\d+-[0-9a-f]{12}$') {
            throw 'The protected signer runner/account or exact build handoff identity is not configured.'
          }
          $Identity = [Security.Principal.WindowsIdentity]::GetCurrent()
          try { $CurrentSid = [string]$Identity.User.Value } finally { $Identity.Dispose() }
          if ($CurrentSid -cne $env:AEGIS_RELEASE_SIGNER_ACCOUNT_SID) { throw 'This is not the protected no-checkout signer account.' }
          if (Test-Path -LiteralPath $env:GITHUB_WORKSPACE) {
            $WorkspaceEntries = @(Get-ChildItem -LiteralPath $env:GITHUB_WORKSPACE -Force -ErrorAction Stop)
            if ($WorkspaceEntries.Count -ne 0) { throw 'Signer workspace is not empty; repository code may have been checked out on this account.' }
          }
          if ($env:AEGIS_ESIGNER_CREDENTIAL_TRANSPORT -cne 'ENVIRONMENT_ONLY_NO_ARGV') {
            throw 'Fail-closed: the approved signer must prove a no-argv credential transport; the repository CKA CLI path is forbidden.'
          }

          function Get-AclEvidence([string]$Path) {
            $Acl = Get-Acl -LiteralPath $Path
            return [pscustomobject]@{
              acl = $Acl
              rules = @($Acl.GetAccessRules($true, $true, [Security.Principal.SecurityIdentifier]))
              owner = [string]$Acl.GetOwner([Security.Principal.SecurityIdentifier]).Value
            }
          }
          function Assert-NoUnsafeWritableAncestor([string]$Path, [string]$VolumeRoot) {
            $Broad = @('S-1-1-0', 'S-1-5-11', 'S-1-5-32-545', 'S-1-5-32-546')
            $Dangerous = [Security.AccessControl.FileSystemRights]::Write -bor [Security.AccessControl.FileSystemRights]::Modify -bor
              [Security.AccessControl.FileSystemRights]::Delete -bor [Security.AccessControl.FileSystemRights]::DeleteSubdirectoriesAndFiles -bor
              [Security.AccessControl.FileSystemRights]::ChangePermissions -bor [Security.AccessControl.FileSystemRights]::TakeOwnership
            $Current = Get-Item -LiteralPath $Path -Force
            while ($Current) {
              if (($Current.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) { throw 'Protected signer path has a reparse-point ancestor.' }
              $AclEvidence = Get-AclEvidence $Current.FullName
              if (@($AclEvidence.rules | Where-Object {
                $_.AccessControlType -eq [Security.AccessControl.AccessControlType]::Allow -and
                (([string]$_.IdentityReference.Value -cin $Broad) -or [string]$_.IdentityReference.Value -ceq $env:AEGIS_RELEASE_BUILD_ACCOUNT_SID) -and
                (($_.FileSystemRights -band $Dangerous) -ne 0)
              }).Count -ne 0) { throw 'Protected signer ancestor is writable by the build SID or a broad principal.' }
              if ($Current.FullName.TrimEnd('\').Equals($VolumeRoot.TrimEnd('\'), [StringComparison]::OrdinalIgnoreCase)) { return }
              $Current = $Current.Parent
            }
            throw 'Protected signer path did not reach its local fixed-volume root.'
          }
          function Assert-ExactFullAcl([string]$Path, [string[]]$Allowed, [string[]]$Owners, [string]$Label) {
            $Evidence = Get-AclEvidence $Path
            $Expected = @($Allowed | Sort-Object -Unique)
            $Actual = @($Evidence.rules | ForEach-Object { [string]$_.IdentityReference.Value } | Sort-Object -Unique)
            if (-not $Evidence.acl.AreAccessRulesProtected -or ($Actual -join '|') -cne ($Expected -join '|') -or
                $Evidence.owner -cnotin $Owners -or @($Evidence.rules | Where-Object { $_.AccessControlType -ne [Security.AccessControl.AccessControlType]::Allow }).Count -ne 0) {
              throw "$Label exact protected ACL/owner is invalid."
            }
            foreach ($Sid in $Expected) {
              if (@($Evidence.rules | Where-Object { [string]$_.IdentityReference.Value -ceq $Sid -and
                  (($_.FileSystemRights -band [Security.AccessControl.FileSystemRights]::FullControl) -eq [Security.AccessControl.FileSystemRights]::FullControl) }).Count -lt 1) {
                throw "$Label lacks FullControl for an exact approved SID."
              }
            }
          }
          function Assert-PrivateRootAcl([string]$Path) {
            $Evidence = Get-AclEvidence $Path
            $Expected = @($env:AEGIS_RELEASE_BUILD_ACCOUNT_SID, $env:AEGIS_RELEASE_SIGNER_ACCOUNT_SID, 'S-1-5-18') | Sort-Object
            $Actual = @($Evidence.rules | ForEach-Object { [string]$_.IdentityReference.Value } | Sort-Object -Unique)
            $Dangerous = [Security.AccessControl.FileSystemRights]::Write -bor [Security.AccessControl.FileSystemRights]::Modify -bor
              [Security.AccessControl.FileSystemRights]::Delete -bor [Security.AccessControl.FileSystemRights]::DeleteSubdirectoriesAndFiles -bor
              [Security.AccessControl.FileSystemRights]::ChangePermissions -bor [Security.AccessControl.FileSystemRights]::TakeOwnership
            $BuildRules = @($Evidence.rules | Where-Object { [string]$_.IdentityReference.Value -ceq $env:AEGIS_RELEASE_BUILD_ACCOUNT_SID })
            if (-not $Evidence.acl.AreAccessRulesProtected -or ($Actual -join '|') -cne ($Expected -join '|') -or
                $Evidence.owner -cnotin @($env:AEGIS_RELEASE_SIGNER_ACCOUNT_SID, 'S-1-5-18') -or $BuildRules.Count -ne 1 -or
                ($BuildRules[0].FileSystemRights -band $Dangerous) -ne 0 -or
                ($BuildRules[0].FileSystemRights -band [Security.AccessControl.FileSystemRights]::ReadAndExecute) -ne [Security.AccessControl.FileSystemRights]::ReadAndExecute -or
                $BuildRules[0].InheritanceFlags -ne [Security.AccessControl.InheritanceFlags]::None) {
              throw 'Private signing root must be signer/SYSTEM-owned and grant the build SID non-inheriting traverse/read only.'
            }
          }
          function Set-SignerOnlyAcl([string]$Path) {
            $Item = Get-Item -LiteralPath $Path -Force
            $Security = if ($Item.PSIsContainer) { [Security.AccessControl.DirectorySecurity]::new() } else { [Security.AccessControl.FileSecurity]::new() }
            $Security.SetOwner([Security.Principal.SecurityIdentifier]::new($env:AEGIS_RELEASE_SIGNER_ACCOUNT_SID))
            $Security.SetAccessRuleProtection($true, $false)
            foreach ($Sid in @($env:AEGIS_RELEASE_SIGNER_ACCOUNT_SID, 'S-1-5-18')) {
              $Inheritance = if ($Item.PSIsContainer) { [Security.AccessControl.InheritanceFlags]'ContainerInherit, ObjectInherit' } else { [Security.AccessControl.InheritanceFlags]::None }
              $Rule = [Security.AccessControl.FileSystemAccessRule]::new(
                [Security.Principal.SecurityIdentifier]::new($Sid), [Security.AccessControl.FileSystemRights]::FullControl,
                $Inheritance, [Security.AccessControl.PropagationFlags]::None, [Security.AccessControl.AccessControlType]::Allow)
              [void]$Security.AddAccessRule($Rule)
            }
            Set-Acl -LiteralPath $Path -AclObject $Security
          }
          function Get-TreeEvidence([string]$Root) {
            $ExactRoot = [IO.Path]::GetFullPath($Root).TrimEnd('\')
            $RootItem = Get-Item -LiteralPath $ExactRoot -Force
            $Entries = @(Get-ChildItem -LiteralPath $ExactRoot -Recurse -Force)
            if (($RootItem.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0 -or
                @($Entries | Where-Object { ($_.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0 }).Count -ne 0) { throw 'Signing input has a reparse point.' }
            if (@($Entries | Where-Object { $_.PSIsContainer -and @(Get-ChildItem -LiteralPath $_.FullName -File -Recurse -Force).Count -eq 0 }).Count -ne 0) {
              throw 'Signing input has an unbound empty directory.'
            }
            $Files = @($Entries | Where-Object { -not $_.PSIsContainer } | Sort-Object FullName)
            if ($Files.Count -lt 2 -or $Files.Count -gt 20000) { throw 'Signing input file count is outside the strict bound.' }
            $Rows = [Collections.Generic.List[object]]::new()
            [long]$Total = 0
            foreach ($File in $Files) {
              $Relative = [IO.Path]::GetRelativePath($ExactRoot, $File.FullName).Replace('\', '/')
              $Total += [long]$File.Length
              if ([string]::IsNullOrWhiteSpace($Relative) -or $Relative.StartsWith('../', [StringComparison]::Ordinal) -or
                  [IO.Path]::IsPathRooted($Relative) -or $File.Length -gt 512MB -or $Total -gt 2GB) { throw 'Signing input path or size escaped its strict boundary.' }
              $Rows.Add([ordered]@{ path = $Relative; size = [long]$File.Length; sha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath $File.FullName).Hash.ToLowerInvariant() })
            }
            $Canonical = (@($Rows | ForEach-Object { "$($_.sha256) $($_.size) $($_.path)" }) -join "`n") + "`n"
            $Hasher = [Security.Cryptography.SHA256]::Create()
            try { $Hash = [Convert]::ToHexString($Hasher.ComputeHash([Text.Encoding]::UTF8.GetBytes($Canonical))).ToLowerInvariant() } finally { $Hasher.Dispose() }
            return [pscustomobject]@{ files = @($Rows); sha256 = $Hash }
          }

          $PrivateRoot = [IO.Path]::GetFullPath($env:AEGIS_PRIVATE_SIGNING_HANDOFF_ROOT).TrimEnd('\')
          if (-not [IO.Path]::IsPathFullyQualified($PrivateRoot) -or $PrivateRoot.StartsWith('\\') -or
              [IO.Path]::GetFileName($PrivateRoot) -cne 'AegisGitHubSigningHandoff' -or -not (Test-Path -LiteralPath $PrivateRoot -PathType Container)) {
            throw 'The pre-provisioned private signing root is missing or malformed.'
          }
          $VolumeRoot = [IO.Path]::GetPathRoot($PrivateRoot)
          $Drive = [IO.DriveInfo]::new($VolumeRoot)
          if (-not $Drive.IsReady -or $Drive.DriveType -ne [IO.DriveType]::Fixed -or $Drive.DriveFormat -cne 'NTFS') { throw 'Private signing root is not on fixed NTFS.' }
          foreach ($Forbidden in @($env:GITHUB_WORKSPACE, $env:RUNNER_TEMP, $env:OneDrive, $env:OneDriveConsumer, $env:OneDriveCommercial)) {
            if (-not $Forbidden) { continue }
            $ExactForbidden = [IO.Path]::GetFullPath($Forbidden).TrimEnd('\')
            if ($PrivateRoot.Equals($ExactForbidden, [StringComparison]::OrdinalIgnoreCase) -or
                $PrivateRoot.StartsWith($ExactForbidden + '\', [StringComparison]::OrdinalIgnoreCase) -or
                $ExactForbidden.StartsWith($PrivateRoot + '\', [StringComparison]::OrdinalIgnoreCase)) { throw 'Private signing root overlaps an unsafe location.' }
          }
          Assert-NoUnsafeWritableAncestor -Path $PrivateRoot -VolumeRoot $VolumeRoot
          Assert-PrivateRootAcl $PrivateRoot
          $IngressRoot = Join-Path $PrivateRoot 'ingress'
          $VaultRoot = Join-Path $PrivateRoot 'signer-vault'
          foreach ($BoundaryRoot in @($IngressRoot, $VaultRoot)) {
            $BoundaryItem = Get-Item -LiteralPath $BoundaryRoot -Force
            if (($BoundaryItem.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0 -or
                -not $BoundaryItem.Parent.FullName.TrimEnd('\').Equals($PrivateRoot, [StringComparison]::OrdinalIgnoreCase)) {
              throw 'Ingress and signer-vault must be direct non-reparse children of the exact private root.'
            }
          }
          $IngressAllowed = @($env:AEGIS_RELEASE_BUILD_ACCOUNT_SID, $env:AEGIS_RELEASE_SIGNER_ACCOUNT_SID, 'S-1-5-18')
          $VaultAllowed = @($env:AEGIS_RELEASE_SIGNER_ACCOUNT_SID, 'S-1-5-18')
          Assert-ExactFullAcl -Path $IngressRoot -Allowed $IngressAllowed -Owners $IngressAllowed -Label 'Signing ingress root'
          Assert-ExactFullAcl -Path $VaultRoot -Allowed $VaultAllowed -Owners $VaultAllowed -Label 'Signer-only vault root'
          $IngressRun = Join-Path $IngressRoot $env:HANDOFF_LEAF
          $VaultClaiming = Join-Path $VaultRoot "$env:HANDOFF_LEAF.claiming"
          $VaultRun = Join-Path $VaultRoot $env:HANDOFF_LEAF
          if (-not (Test-Path -LiteralPath $IngressRun -PathType Container) -or
              (Test-Path -LiteralPath "$IngressRun.incomplete") -or (Test-Path -LiteralPath $VaultClaiming) -or (Test-Path -LiteralPath $VaultRun)) {
            throw 'The exact ingress exists once and the signer-only claim destination is empty.'
          }
          $IngressManifestPath = Join-Path $IngressRun 'unsigned-signing-handoff.json'
          $IngressInputRoot = Join-Path $IngressRun 'portable-unsigned'
          $IngressTop = @(Get-ChildItem -LiteralPath $IngressRun -Force)
          if ($IngressTop.Count -ne 2 -or
              @($IngressTop | Where-Object { $_.Name -ceq 'portable-unsigned' -and $_.PSIsContainer }).Count -ne 1 -or
              @($IngressTop | Where-Object { $_.Name -ceq 'unsigned-signing-handoff.json' -and -not $_.PSIsContainer }).Count -ne 1) {
            throw 'Ingress top-level inventory is not the exact unsigned directory and manifest.'
          }
          $IngressEntriesBeforeClaim = @((Get-Item -LiteralPath $IngressRun -Force); Get-ChildItem -LiteralPath $IngressRun -Recurse -Force)
          if (@($IngressEntriesBeforeClaim | Where-Object { ($_.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0 }).Count -ne 0) {
            throw 'Ingress contains a junction/reparse point before exclusive ACL transfer.'
          }
          $IngressManifestHashBefore = (Get-FileHash -Algorithm SHA256 -LiteralPath $IngressManifestPath).Hash.ToLowerInvariant()
          $IngressEvidenceBefore = Get-TreeEvidence -Root $IngressInputRoot
          # Phase 1: revoke the build SID from every ingress object before crossing
          # into the signer-only parent. A same-account open-handle race is caught
          # by the before/after content evidence; a parent delete/rename race makes
          # the exact atomic move fail closed.
          foreach ($Entry in $IngressEntriesBeforeClaim) { Set-SignerOnlyAcl $Entry.FullName }
          foreach ($Entry in @((Get-Item -LiteralPath $IngressRun -Force); Get-ChildItem -LiteralPath $IngressRun -Recurse -Force)) {
            Assert-ExactFullAcl -Path $Entry.FullName -Allowed $VaultAllowed -Owners $VaultAllowed -Label "Claimed ingress $($Entry.Name)"
          }
          $IngressEvidenceAfterClaim = Get-TreeEvidence -Root $IngressInputRoot
          $IngressManifestHashAfterClaim = (Get-FileHash -Algorithm SHA256 -LiteralPath $IngressManifestPath).Hash.ToLowerInvariant()
          if ($IngressEvidenceBefore.sha256 -cne $IngressEvidenceAfterClaim.sha256 -or
              $IngressManifestHashBefore -cne $IngressManifestHashAfterClaim) {
            throw 'Signer claim rejected a concurrent ingress replacement during exclusive ACL transfer.'
          }
          [IO.Directory]::Move($IngressRun, $VaultClaiming)
          if (Test-Path -LiteralPath $IngressRun) { throw 'Build-writable ingress identity remained after atomic signer-vault transfer.' }
          $VaultInputRoot = Join-Path $VaultClaiming 'portable-unsigned'
          $VaultManifestPath = Join-Path $VaultClaiming 'unsigned-signing-handoff.json'
          $VaultEvidence = Get-TreeEvidence -Root $VaultInputRoot
          $VaultManifestHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $VaultManifestPath).Hash.ToLowerInvariant()
          if ($IngressEvidenceBefore.sha256 -cne $env:INPUT_TREE_SHA256 -or $VaultEvidence.sha256 -cne $env:INPUT_TREE_SHA256 -or
              $IngressEvidenceAfterClaim.sha256 -cne $env:INPUT_TREE_SHA256 -or $IngressManifestHashBefore -cne $IngressManifestHashAfterClaim -or
              $VaultManifestHash -cne $IngressManifestHashBefore) {
            throw 'Signer claim rejected a concurrent ingress replacement or changed signer-vault transfer.'
          }
          $Manifest = Get-Content -Raw -LiteralPath $VaultManifestPath | ConvertFrom-Json
          $ManifestKeys = @($Manifest.PSObject.Properties.Name | Sort-Object)
          $ExpectedManifestKeys = @('administratorsAclAllowed','archiveName','author','buildAccountIsAdministrator','buildAccountSid','buildRunnerName','githubArtifactUploaded','githubRunAttempt','githubRunId','handoffPhase','ingressSubdirectory','inputFiles','inputTreeSha256','machineGuidSha256','product','releaseTag','schemaVersion','signerAccountSid','signerRunnerName','sourceCommit','storageBoundary','unsignedInput','vaultSubdirectory') | Sort-Object
          $MachineGuid = [string](Get-ItemPropertyValue -LiteralPath 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Cryptography' -Name MachineGuid)
          $MachineHasher = [Security.Cryptography.SHA256]::Create()
          try { $MachineGuidSha256 = [Convert]::ToHexString($MachineHasher.ComputeHash([Text.Encoding]::UTF8.GetBytes($MachineGuid.ToLowerInvariant()))).ToLowerInvariant() } finally { $MachineHasher.Dispose() }
          if (($ManifestKeys -join '|') -cne ($ExpectedManifestKeys -join '|') -or $Manifest.schemaVersion -ne 2 -or
              $Manifest.sourceCommit -cne $env:SOURCE_COMMIT -or $Manifest.releaseTag -cne $env:RELEASE_TAG -or
              $Manifest.archiveName -cne $env:ARCHIVE_NAME -or $Manifest.buildRunnerName -cne $env:AEGIS_RELEASE_BUILD_RUNNER_NAME -or
              $Manifest.signerRunnerName -cne $env:AEGIS_RELEASE_SIGNER_RUNNER_NAME -or
              $Manifest.buildAccountSid -cne $env:AEGIS_RELEASE_BUILD_ACCOUNT_SID -or $Manifest.signerAccountSid -cne $env:AEGIS_RELEASE_SIGNER_ACCOUNT_SID -or
              $Manifest.machineGuidSha256 -cne $MachineGuidSha256 -or $Manifest.buildAccountIsAdministrator -or $Manifest.administratorsAclAllowed -or
              $Manifest.inputTreeSha256 -cne $env:INPUT_TREE_SHA256 -or -not $Manifest.unsignedInput -or $Manifest.githubArtifactUploaded -or
              $Manifest.ingressSubdirectory -cne 'ingress' -or $Manifest.vaultSubdirectory -cne 'signer-vault' -or
              $Manifest.handoffPhase -cne 'INGRESS_READY_FOR_EXCLUSIVE_SIGNER_CLAIM' -or
              $Manifest.storageBoundary -cne 'LOCAL_FIXED_NTFS_SPLIT_EXCLUSIVE_ACL' -or
              ($VaultEvidence.files | ConvertTo-Json -Depth 4 -Compress) -cne (@($Manifest.inputFiles) | ConvertTo-Json -Depth 4 -Compress)) {
            throw 'Unsigned signing handoff manifest is not exact.'
          }
          [IO.Directory]::Move($VaultClaiming, $VaultRun)
          $InputRoot = Join-Path $VaultRun 'portable-unsigned'
          $ManifestPath = Join-Path $VaultRun 'unsigned-signing-handoff.json'
          $FinalVaultEvidence = Get-TreeEvidence -Root $InputRoot
          if ($FinalVaultEvidence.sha256 -cne $env:INPUT_TREE_SHA256) { throw 'Signer-vault atomic completion changed the claimed input.' }
          foreach ($Entry in @((Get-Item -LiteralPath $VaultRun -Force); Get-ChildItem -LiteralPath $VaultRun -Recurse -Force)) {
            Assert-ExactFullAcl -Path $Entry.FullName -Allowed $VaultAllowed -Owners $VaultAllowed -Label $Entry.Name
          }
          if (Test-Path -LiteralPath $IngressRun) { throw 'Build-writable ingress remained after signer-only vault claim.' }

          $Orchestrator = [IO.Path]::GetFullPath($env:AEGIS_TRUSTED_SIGNER_ORCHESTRATOR_PATH)
          if (-not [IO.Path]::IsPathFullyQualified($Orchestrator) -or -not (Test-Path -LiteralPath $Orchestrator -PathType Leaf) -or
              $Orchestrator.StartsWith($PrivateRoot + '\', [StringComparison]::OrdinalIgnoreCase) -or
              ($env:GITHUB_WORKSPACE -and $Orchestrator.StartsWith([IO.Path]::GetFullPath($env:GITHUB_WORKSPACE).TrimEnd('\') + '\', [StringComparison]::OrdinalIgnoreCase)) -or
              $env:AEGIS_TRUSTED_SIGNER_ORCHESTRATOR_SHA256 -cnotmatch '^[0-9a-f]{64}$' -or
              (Get-FileHash -Algorithm SHA256 -LiteralPath $Orchestrator).Hash.ToLowerInvariant() -cne $env:AEGIS_TRUSTED_SIGNER_ORCHESTRATOR_SHA256 -or
              $env:AEGIS_TRUSTED_SIGNER_ORCHESTRATOR_SIGNER_THUMBPRINT -cnotmatch '^[0-9a-f]{40}$') { throw 'The out-of-band signer orchestrator path/hash policy is not exact.' }
          $OrchestratorItem = Get-Item -LiteralPath $Orchestrator -Force
          if (($OrchestratorItem.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) { throw 'Trusted signer orchestrator is a reparse point.' }
          $OrchestratorVolume = [IO.Path]::GetPathRoot($Orchestrator)
          $OrchestratorDrive = [IO.DriveInfo]::new($OrchestratorVolume)
          if (-not $OrchestratorDrive.IsReady -or $OrchestratorDrive.DriveType -ne [IO.DriveType]::Fixed -or $OrchestratorDrive.DriveFormat -cne 'NTFS') {
            throw 'Trusted signer orchestrator must be on local fixed NTFS.'
          }
          Assert-NoUnsafeWritableAncestor -Path $Orchestrator -VolumeRoot $OrchestratorVolume
          $OrchestratorSignature = Get-AuthenticodeSignature -LiteralPath $Orchestrator
          if ($OrchestratorSignature.Status -ne [Management.Automation.SignatureStatus]::Valid -or -not $OrchestratorSignature.SignerCertificate -or
              $OrchestratorSignature.SignerCertificate.Thumbprint.ToLowerInvariant() -cne $env:AEGIS_TRUSTED_SIGNER_ORCHESTRATOR_SIGNER_THUMBPRINT) { throw 'The hash-bound out-of-band signer orchestrator lacks its exact trusted Authenticode signer.' }
          $SignedOutput = Join-Path $VaultRun 'signed-output'
          if (Test-Path -LiteralPath $SignedOutput) { throw 'Signer output must not preexist.' }
          "AEGIS_VALIDATED_SIGNER_ORCHESTRATOR=$Orchestrator" >> $env:GITHUB_ENV
          "AEGIS_VALIDATED_SIGNER_VAULT=$VaultRun" >> $env:GITHUB_ENV
          "AEGIS_SIGNER_MACHINE_GUID_SHA256=$MachineGuidSha256" >> $env:GITHUB_ENV
          "AEGIS_VALIDATED_UNSIGNED_INPUT=$InputRoot" >> $env:GITHUB_ENV
          "AEGIS_VALIDATED_UNSIGNED_MANIFEST=$ManifestPath" >> $env:GITHUB_ENV
          "AEGIS_VALIDATED_SIGNED_OUTPUT=$SignedOutput" >> $env:GITHUB_ENV

      - name: Sign through the trusted no-argv orchestrator and remove all signer state
        shell: pwsh
        env:
          SSL_ESIGNER_USERNAME: ${{ secrets.SSL_ESIGNER_USERNAME }}
          SSL_ESIGNER_PASSWORD: ${{ secrets.SSL_ESIGNER_PASSWORD }}
          SSL_ESIGNER_TOTP_SECRET: ${{ secrets.SSL_ESIGNER_TOTP_SECRET }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          Set-StrictMode -Version Latest
          $SecretNames = @('SSL_ESIGNER_USERNAME', 'SSL_ESIGNER_PASSWORD', 'SSL_ESIGNER_TOTP_SECRET')
          foreach ($Name in $SecretNames) {
            $Value = [Environment]::GetEnvironmentVariable($Name, 'Process')
            if ([string]::IsNullOrWhiteSpace($Value)) { throw "Protected signer secret $Name is missing." }
            Write-Output "::add-mask::$Value"
          }
          if ($env:AEGIS_ESIGNER_CREDENTIAL_TRANSPORT -cne 'ENVIRONMENT_ONLY_NO_ARGV') {
            throw 'Fail-closed: vendor credentials may not be placed in a process argument list.'
          }
          function Assert-SignerOnlyAcl([string]$Path) {
            $Acl = Get-Acl -LiteralPath $Path
            $Rules = @($Acl.GetAccessRules($true, $true, [Security.Principal.SecurityIdentifier]))
            $Expected = @($env:AEGIS_RELEASE_SIGNER_ACCOUNT_SID, 'S-1-5-18') | Sort-Object
            $Actual = @($Rules | ForEach-Object { [string]$_.IdentityReference.Value } | Sort-Object -Unique)
            if (-not $Acl.AreAccessRulesProtected -or ($Actual -join '|') -cne ($Expected -join '|') -or
                [string]$Acl.GetOwner([Security.Principal.SecurityIdentifier]).Value -cnotin $Expected -or
                @($Rules | Where-Object { $_.AccessControlType -ne [Security.AccessControl.AccessControlType]::Allow -or
                  (($_.FileSystemRights -band [Security.AccessControl.FileSystemRights]::FullControl) -ne [Security.AccessControl.FileSystemRights]::FullControl) }).Count -ne 0) {
              throw 'Secret-bearing signer step found a non-exclusive vault ACL.'
            }
          }
          function Get-InputTreeSha256([string]$Root) {
            $RootItem = Get-Item -LiteralPath $Root -Force
            $Entries = @(Get-ChildItem -LiteralPath $Root -Recurse -Force)
            if (($RootItem.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0 -or
                @($Entries | Where-Object { ($_.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0 }).Count -ne 0) { throw 'Secret-bearing signer input contains a junction/reparse point.' }
            if (@($Entries | Where-Object { $_.PSIsContainer -and @(Get-ChildItem -LiteralPath $_.FullName -File -Recurse -Force).Count -eq 0 }).Count -ne 0) {
              throw 'Secret-bearing signer input contains an unbound empty directory.'
            }
            $Files = @($Entries | Where-Object { -not $_.PSIsContainer } | Sort-Object FullName)
            if ($Files.Count -lt 2 -or $Files.Count -gt 20000) { throw 'Secret-bearing signer input file count is outside the strict bound.' }
            [long]$Total = 0
            $Rows = @($Files | ForEach-Object {
              $Total += [long]$_.Length
              $Relative = [IO.Path]::GetRelativePath($Root, $_.FullName).Replace('\', '/')
              if ($Relative.StartsWith('../') -or $_.Length -gt 512MB -or $Total -gt 2GB) { throw 'Secret-bearing signer input path/size escaped its strict bound.' }
              $FileHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash.ToLowerInvariant()
              "$FileHash $($_.Length) $Relative"
            })
            $Text = ($Rows -join "`n") + "`n"
            return [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData([Text.Encoding]::UTF8.GetBytes($Text))).ToLowerInvariant()
          }
          $Vault = [IO.Path]::GetFullPath($env:AEGIS_VALIDATED_SIGNER_VAULT).TrimEnd('\')
          $VaultPrefix = $Vault + '\'
          foreach ($ExactPath in @($env:AEGIS_VALIDATED_UNSIGNED_INPUT, $env:AEGIS_VALIDATED_UNSIGNED_MANIFEST, $env:AEGIS_VALIDATED_SIGNED_OUTPUT)) {
            if (-not [IO.Path]::GetFullPath($ExactPath).StartsWith($VaultPrefix, [StringComparison]::OrdinalIgnoreCase)) {
              throw 'Signer input, manifest, output, and receipt must remain inside the signer-only vault.'
            }
          }
          foreach ($Entry in @((Get-Item -LiteralPath $Vault -Force); Get-ChildItem -LiteralPath $Vault -Recurse -Force)) {
            if (($Entry.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) { throw 'Signer-only vault contains a junction/reparse point before secret use.' }
            Assert-SignerOnlyAcl $Entry.FullName
          }
          if ((Get-InputTreeSha256 $env:AEGIS_VALIDATED_UNSIGNED_INPUT) -cne $env:INPUT_TREE_SHA256 -or
              (Test-Path -LiteralPath $env:AEGIS_VALIDATED_SIGNED_OUTPUT)) { throw 'Signer-only vault input changed or output preexisted before secret use.' }
          # Revalidate the orchestrator immediately before the only secret-bearing invocation.
          $Orchestrator = [IO.Path]::GetFullPath($env:AEGIS_VALIDATED_SIGNER_ORCHESTRATOR)
          $OrchestratorItem = Get-Item -LiteralPath $Orchestrator -Force
          $OrchestratorVolume = [IO.Path]::GetPathRoot($Orchestrator)
          $OrchestratorDrive = [IO.DriveInfo]::new($OrchestratorVolume)
          if (($OrchestratorItem.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0 -or
              -not $OrchestratorDrive.IsReady -or $OrchestratorDrive.DriveType -ne [IO.DriveType]::Fixed -or $OrchestratorDrive.DriveFormat -cne 'NTFS' -or
              (Get-FileHash -Algorithm SHA256 -LiteralPath $Orchestrator).Hash.ToLowerInvariant() -cne $env:AEGIS_TRUSTED_SIGNER_ORCHESTRATOR_SHA256) {
            throw 'Trusted signer orchestrator changed before secret-bearing invocation.'
          }
          $CurrentAncestor = $OrchestratorItem
          $BroadSids = @('S-1-1-0', 'S-1-5-11', 'S-1-5-32-545', 'S-1-5-32-546')
          $DangerousRights = [Security.AccessControl.FileSystemRights]::Write -bor [Security.AccessControl.FileSystemRights]::Modify -bor
            [Security.AccessControl.FileSystemRights]::Delete -bor [Security.AccessControl.FileSystemRights]::DeleteSubdirectoriesAndFiles -bor
            [Security.AccessControl.FileSystemRights]::ChangePermissions -bor [Security.AccessControl.FileSystemRights]::TakeOwnership
          while ($CurrentAncestor) {
            if (($CurrentAncestor.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) { throw 'Trusted signer orchestrator gained a reparse-point ancestor.' }
            $AncestorAcl = Get-Acl -LiteralPath $CurrentAncestor.FullName
            $AncestorRules = @($AncestorAcl.GetAccessRules($true, $true, [Security.Principal.SecurityIdentifier]))
            if (@($AncestorRules | Where-Object {
              $_.AccessControlType -eq [Security.AccessControl.AccessControlType]::Allow -and
              (([string]$_.IdentityReference.Value -cin $BroadSids) -or [string]$_.IdentityReference.Value -ceq $env:AEGIS_RELEASE_BUILD_ACCOUNT_SID) -and
              (($_.FileSystemRights -band $DangerousRights) -ne 0)
            }).Count -ne 0) { throw 'Trusted signer orchestrator ancestor ACL became build/broad writable.' }
            if ($CurrentAncestor.FullName.TrimEnd('\').Equals($OrchestratorVolume.TrimEnd('\'), [StringComparison]::OrdinalIgnoreCase)) { break }
            $CurrentAncestor = $CurrentAncestor.Parent
          }
          $OrchestratorLock = [IO.FileStream]::new($Orchestrator, [IO.FileMode]::Open, [IO.FileAccess]::Read, [IO.FileShare]::Read)
          try {
            $ImmediateHasher = [Security.Cryptography.SHA256]::Create()
            try {
              $ImmediateHash = [Convert]::ToHexString($ImmediateHasher.ComputeHash($OrchestratorLock)).ToLowerInvariant()
            } finally { $ImmediateHasher.Dispose() }
            if ($ImmediateHash -cne $env:AEGIS_TRUSTED_SIGNER_ORCHESTRATOR_SHA256) {
              throw 'Locked trusted signer orchestrator hash changed immediately before secret-bearing invocation.'
            }
            $ImmediateSignature = Get-AuthenticodeSignature -LiteralPath $Orchestrator
            if ($ImmediateSignature.Status -ne [Management.Automation.SignatureStatus]::Valid -or -not $ImmediateSignature.SignerCertificate -or
                $ImmediateSignature.SignerCertificate.Thumbprint.ToLowerInvariant() -cne $env:AEGIS_TRUSTED_SIGNER_ORCHESTRATOR_SIGNER_THUMBPRINT) {
              throw 'Trusted signer orchestrator Authenticode identity changed immediately before secret-bearing invocation.'
            }
            $global:LASTEXITCODE = 0
            & $Orchestrator `
              -InputDirectory $env:AEGIS_VALIDATED_UNSIGNED_INPUT `
              -InputManifest $env:AEGIS_VALIDATED_UNSIGNED_MANIFEST `
              -OutputDirectory $env:AEGIS_VALIDATED_SIGNED_OUTPUT `
              -ExpectedSourceCommit $env:SOURCE_COMMIT `
              -ExpectedInputTreeSha256 $env:INPUT_TREE_SHA256 `
              -ArchiveName $env:ARCHIVE_NAME `
              -CredentialTransport 'ENVIRONMENT_ONLY_NO_ARGV'
            if ($LASTEXITCODE -ne 0) { throw "Trusted signer orchestrator returned native exit code $LASTEXITCODE." }
          } finally {
            $OrchestratorLock.Dispose()
            foreach ($Name in $SecretNames) { [Environment]::SetEnvironmentVariable($Name, $null, 'Process') }
          }

      - name: Verify signed output and cleanup receipt before any action download
        id: signed_metadata
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          function Get-TextSha256([string]$Text) {
            return [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData([Text.Encoding]::UTF8.GetBytes($Text))).ToLowerInvariant()
          }
          function Assert-SignerOnlyAcl([string]$Path) {
            $Acl = Get-Acl -LiteralPath $Path
            $Rules = @($Acl.GetAccessRules($true, $true, [Security.Principal.SecurityIdentifier]))
            $Expected = @($env:AEGIS_RELEASE_SIGNER_ACCOUNT_SID, 'S-1-5-18') | Sort-Object
            $Actual = @($Rules | ForEach-Object { [string]$_.IdentityReference.Value } | Sort-Object -Unique)
            if (-not $Acl.AreAccessRulesProtected -or ($Actual -join '|') -cne ($Expected -join '|') -or
                [string]$Acl.GetOwner([Security.Principal.SecurityIdentifier]).Value -cnotin $Expected -or
                @($Rules | Where-Object { $_.AccessControlType -ne [Security.AccessControl.AccessControlType]::Allow -or
                  (($_.FileSystemRights -band [Security.AccessControl.FileSystemRights]::FullControl) -ne [Security.AccessControl.FileSystemRights]::FullControl) }).Count -ne 0) {
              throw 'Post-signing output/receipt is outside the exclusive signer-only ACL.'
            }
          }
          function Get-CertificateInventorySha256 {
            $Rows = [Collections.Generic.List[string]]::new()
            foreach ($Store in @('My', 'Root', 'TrustedPeople')) {
              foreach ($Certificate in @(Get-ChildItem -LiteralPath "Cert:\CurrentUser\$Store" | Sort-Object Thumbprint)) {
                $Rows.Add("$Store`t$($Certificate.Thumbprint.ToLowerInvariant())`t$($Certificate.Subject)`t$($Certificate.Issuer)`t$([bool]$Certificate.HasPrivateKey)`t$($Certificate.NotBefore.ToUniversalTime().Ticks)`t$($Certificate.NotAfter.ToUniversalTime().Ticks)")
              }
            }
            return Get-TextSha256 ((@($Rows | Sort-Object) -join "`n") + "`n")
          }
          function Get-CngProviderInventorySha256 {
            $Roots = @(
              'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Cryptography\Defaults\Provider',
              'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\WOW6432Node\Microsoft\Cryptography\Defaults\Provider',
              'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Cryptography\Providers',
              'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\WOW6432Node\Microsoft\Cryptography\Providers',
              'Registry::HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Control\Cryptography\Providers',
              'Registry::HKEY_CURRENT_USER\SOFTWARE\Microsoft\Cryptography\Providers'
            )
            $Rows = [Collections.Generic.List[string]]::new()
            foreach ($Root in $Roots) {
              if (-not (Test-Path -LiteralPath $Root)) { continue }
              foreach ($Key in @((Get-Item -LiteralPath $Root); Get-ChildItem -LiteralPath $Root -Recurse) | Sort-Object Name) {
                $RelativeKey = if ($Key.Name.Length -eq $Root.Replace('Registry::', '').Length) { '.' } else { $Key.Name.Substring($Root.Replace('Registry::', '').Length).TrimStart('\') }
                $ValueNames = @($Key.GetValueNames() | Sort-Object)
                if ($ValueNames.Count -eq 0) { $Rows.Add("$Root`t$RelativeKey`t<KEY>") }
                foreach ($ValueName in $ValueNames) {
                  $Kind = [string]$Key.GetValueKind($ValueName)
                  $Value = $Key.GetValue($ValueName, $null, [Microsoft.Win32.RegistryValueOptions]::DoNotExpandEnvironmentNames)
                  $CanonicalValue = if ($Value -is [byte[]]) {
                    [Convert]::ToHexString($Value).ToLowerInvariant()
                  } elseif ($Value -is [string[]]) {
                    @($Value | ForEach-Object { "$($_.Length):$_" }) -join '|'
                  } else { [Convert]::ToString($Value, [Globalization.CultureInfo]::InvariantCulture) }
                  $Rows.Add("$Root`t$RelativeKey`t$ValueName`t$Kind`t$CanonicalValue")
                }
              }
            }
            return Get-TextSha256 ((@($Rows | Sort-Object) -join "`n") + "`n")
          }
          function Get-PrivateKeyInventorySha256 {
            $Roots = [ordered]@{
              cng = (Join-Path $env:APPDATA 'Microsoft\Crypto\Keys')
              rsa = (Join-Path $env:APPDATA "Microsoft\Crypto\RSA\$env:AEGIS_RELEASE_SIGNER_ACCOUNT_SID")
            }
            $Rows = [Collections.Generic.List[string]]::new()
            foreach ($Pair in $Roots.GetEnumerator()) {
              if (-not (Test-Path -LiteralPath $Pair.Value)) { continue }
              $RootItem = Get-Item -LiteralPath $Pair.Value -Force
              $Files = @(Get-ChildItem -LiteralPath $Pair.Value -File -Force -Recurse)
              if (($RootItem.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0 -or
                  @($Files | Where-Object { ($_.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0 }).Count -ne 0) {
                throw 'Signer private-key inventory contains a reparse point.'
              }
              foreach ($File in $Files) {
                $Relative = [IO.Path]::GetRelativePath($Pair.Value, $File.FullName).Replace('\', '/')
                $Rows.Add("$($Pair.Key)`t$Relative`t$($File.Length)`t$((Get-FileHash -Algorithm SHA256 -LiteralPath $File.FullName).Hash.ToLowerInvariant())")
              }
            }
            return Get-TextSha256 ((@($Rows | Sort-Object) -join "`n") + "`n")
          }
          function Get-SafeArchiveEvidence([string]$ArchivePath, [string]$ExtractionRoot) {
            $ProductDirectory = 'QuantScenarioStudio-by-LAI-ZEYU-1.5.0-x64'
            $Prefix = "$ProductDirectory/"
            Add-Type -AssemblyName System.IO.Compression.FileSystem
            $ArchiveItem = Get-Item -LiteralPath $ArchivePath -Force
            if (($ArchiveItem.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0 -or $ArchiveItem.Length -lt 1KB -or $ArchiveItem.Length -gt 1GB) {
              throw 'Signed ZIP file boundary is invalid.'
            }
            foreach ($StartPath in @($ArchiveItem.Directory.FullName, [IO.Path]::GetDirectoryName([IO.Path]::GetFullPath($ExtractionRoot)))) {
              $Ancestor = Get-Item -LiteralPath $StartPath -Force
              while ($Ancestor) {
                if (($Ancestor.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) { throw 'Signed ZIP archive/extraction path has a reparse-point ancestor.' }
                $Ancestor = $Ancestor.Parent
              }
            }
            $ArchiveShaBefore = (Get-FileHash -Algorithm SHA256 -LiteralPath $ArchiveItem.FullName).Hash.ToLowerInvariant()
            $Zip = [IO.Compression.ZipFile]::OpenRead($ArchivePath)
            $Seen = [Collections.Generic.HashSet[string]]::new([StringComparer]::OrdinalIgnoreCase)
            $PathNodes = [Collections.Generic.Dictionary[string, object]]::new([StringComparer]::OrdinalIgnoreCase)
            $Rows = [Collections.Generic.List[object]]::new()
            [long]$ExpandedSize = 0
            $FileCount = 0
            try {
              if ($Zip.Entries.Count -lt 2 -or $Zip.Entries.Count -gt 20000) { throw 'Signed ZIP entry count is outside the strict bound.' }
              foreach ($Entry in $Zip.Entries) {
                $OriginalName = $Entry.FullName
                $Name = $OriginalName.Replace('\', '/')
                $IsDirectory = $Name.EndsWith('/')
                $PathText = if ($IsDirectory) { $Name.TrimEnd('/') } else { $Name }
                $Segments = @($PathText.Split('/'))
                if ([string]::IsNullOrWhiteSpace($Name) -or $OriginalName -cne $Name -or $Name.Length -gt 4096 -or $Name.StartsWith('/') -or $Name.Contains(':') -or $Name.Contains('//') -or
                    $Name.IndexOfAny([char[]]@(0..31)) -ge 0 -or
                    $Name -cne $Name.Normalize([Text.NormalizationForm]::FormC) -or
                    (-not $Name.StartsWith($Prefix, [StringComparison]::Ordinal) -and $Name -cne $Prefix) -or
                    @($Segments | Where-Object { [string]::IsNullOrWhiteSpace($_) -or $_ -in @('.', '..') -or $_.Length -gt 255 -or $_.Trim() -cne $_ -or $_.TrimEnd(' ', '.') -cne $_ -or $_ -match '^(?i:CON|PRN|AUX|NUL|COM[1-9]|LPT[1-9])(?:\..*)?$' }).Count -ne 0 -or
                    -not $Seen.Add($Name.TrimEnd('/'))) { throw "Signed ZIP contains traversal, root-level, duplicate, case-colliding, or noncanonical entry: $Name" }
                for ($NodeIndex = 0; $NodeIndex -lt $Segments.Count; $NodeIndex++) {
                  $NodePath = @($Segments[0..$NodeIndex]) -join '/'
                  $NodeKind = if ($NodeIndex -eq ($Segments.Count - 1) -and -not $IsDirectory) { 'file' } else { 'directory' }
                  if ($PathNodes.ContainsKey($NodePath)) {
                    $ExistingNode = $PathNodes[$NodePath]
                    if ([string]$ExistingNode.path -cne $NodePath -or [string]$ExistingNode.type -cne $NodeKind) { throw "Signed ZIP has an implicit directory case collision or file/directory conflict: $NodePath" }
                  } else { $PathNodes.Add($NodePath, [ordered]@{ path = $NodePath; type = $NodeKind }) }
                }
                $External = [uint32]([int64]$Entry.ExternalAttributes -band 0xffffffffL)
                $UnixType = ($External -shr 16) -band 0xF000
                if ($UnixType -eq 0xA000 -or $UnixType -notin @(0, 0x4000, 0x8000) -or
                    ($IsDirectory -and $UnixType -notin @(0, 0x4000)) -or (-not $IsDirectory -and $UnixType -eq 0x4000) -or
                    (($External -band 0xFFFF) -band [uint32][IO.FileAttributes]::ReparsePoint) -ne 0) { throw "Signed ZIP contains a symlink/reparse entry: $Name" }
                if ($IsDirectory) {
                  if ($Entry.Length -ne 0) { throw "Signed ZIP directory entry has content: $Name" }
                  $Rows.Add([ordered]@{ path = $Name; type = 'directory'; size = 0; sha256 = '-' })
                  continue
                }
                $ExpandedSize += [long]$Entry.Length
                if ($Entry.Length -gt 512MB -or $ExpandedSize -gt 2GB) { throw 'Signed ZIP expanded-size bound was exceeded.' }
                $Stream = $Entry.Open()
                try { $Hash = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($Stream)).ToLowerInvariant() } finally { $Stream.Dispose() }
                $Rows.Add([ordered]@{ path = $Name; type = 'file'; size = [long]$Entry.Length; sha256 = $Hash })
                $FileCount++
              }
            } finally { $Zip.Dispose() }
            if ($FileCount -lt 2 -or -not $PathNodes.ContainsKey($ProductDirectory) -or
                [string]$PathNodes[$ProductDirectory].path -cne $ProductDirectory -or [string]$PathNodes[$ProductDirectory].type -cne 'directory' -or
                (Test-Path -LiteralPath $ExtractionRoot)) { throw 'Signed ZIP lacks one exact product prefix or extraction root is not new.' }
            Expand-Archive -LiteralPath $ArchivePath -DestinationPath $ExtractionRoot
            if ((Get-FileHash -Algorithm SHA256 -LiteralPath $ArchivePath).Hash.ToLowerInvariant() -cne $ArchiveShaBefore) { throw 'Signed ZIP changed during strict validation/extraction.' }
            $Extracted = @((Get-Item -LiteralPath $ExtractionRoot -Force); Get-ChildItem -LiteralPath $ExtractionRoot -Recurse -Force)
            if (@($Extracted | Where-Object { ($_.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0 }).Count -ne 0) { throw 'Signed ZIP extraction root contains a reparse point.' }
            $RootChildren = @(Get-ChildItem -LiteralPath $ExtractionRoot -Force)
            if ($RootChildren.Count -ne 1 -or -not $RootChildren[0].PSIsContainer -or $RootChildren[0].Name -cne $ProductDirectory) {
              throw 'Signed ZIP extraction has a root-level extra file or non-exact product directory.'
            }
            $ExpectedExtractedNodes = @($PathNodes.Values | Sort-Object path)
            $ActualExtractedNodes = @((Get-Item -LiteralPath $RootChildren[0].FullName -Force); Get-ChildItem -LiteralPath $RootChildren[0].FullName -Recurse -Force) | ForEach-Object {
              [ordered]@{ path = [IO.Path]::GetRelativePath($ExtractionRoot, $_.FullName).Replace('\', '/'); type = if ($_.PSIsContainer) { 'directory' } else { 'file' } }
            } | Sort-Object path
            if ($ActualExtractedNodes.Count -ne $ExpectedExtractedNodes.Count) { throw 'Signed ZIP full extraction node count differs from its derived inventory.' }
            for ($NodeIndex = 0; $NodeIndex -lt $ExpectedExtractedNodes.Count; $NodeIndex++) {
              if ([string]$ActualExtractedNodes[$NodeIndex].path -cne [string]$ExpectedExtractedNodes[$NodeIndex].path -or
                  [string]$ActualExtractedNodes[$NodeIndex].type -cne [string]$ExpectedExtractedNodes[$NodeIndex].type) {
                throw "Signed ZIP full extraction node inventory drifted: $([string]$ActualExtractedNodes[$NodeIndex].path)"
              }
            }
            $ExpectedFiles = @($Rows | Where-Object type -ceq 'file' | Sort-Object path)
            $ActualFiles = @(Get-ChildItem -LiteralPath $ExtractionRoot -File -Recurse -Force | Sort-Object FullName)
            if ($ActualFiles.Count -ne $ExpectedFiles.Count) { throw 'Signed ZIP extraction file count differs from full entry inventory.' }
            for ($Index = 0; $Index -lt $ExpectedFiles.Count; $Index++) {
              $Relative = [IO.Path]::GetRelativePath($ExtractionRoot, $ActualFiles[$Index].FullName).Replace('\', '/')
              if ($Relative -cne [string]$ExpectedFiles[$Index].path -or $ActualFiles[$Index].Length -ne [long]$ExpectedFiles[$Index].size -or
                  (Get-FileHash -Algorithm SHA256 -LiteralPath $ActualFiles[$Index].FullName).Hash.ToLowerInvariant() -cne [string]$ExpectedFiles[$Index].sha256) {
                throw "Signed ZIP extracted inventory drifted: $Relative"
              }
            }
            $InventoryText = (@($Rows | Sort-Object path | ForEach-Object { "$($_.type)`t$($_.size)`t$($_.sha256)`t$($_.path)" }) -join "`n") + "`n"
            return [pscustomobject]@{
              productRoot = $RootChildren[0].FullName
              entryCount = $Rows.Count
              fileCount = $FileCount
              expandedSize = $ExpandedSize
              inventorySha256 = Get-TextSha256 $InventoryText
            }
          }
          $OutputRoot = [IO.Path]::GetFullPath($env:AEGIS_VALIDATED_SIGNED_OUTPUT)
          $VaultRoot = [IO.Path]::GetFullPath($env:AEGIS_VALIDATED_SIGNER_VAULT).TrimEnd('\')
          if (-not $OutputRoot.StartsWith($VaultRoot + '\', [StringComparison]::OrdinalIgnoreCase)) {
            throw 'Signer output/receipt escaped the signer-only vault.'
          }
          $Archive = Join-Path $OutputRoot $env:ARCHIVE_NAME
          $Checksum = "$Archive.sha256"
          $ReceiptPath = Join-Path $OutputRoot 'trusted-signing-receipt.json'
          $Names = @(Get-ChildItem -LiteralPath $OutputRoot -File -Force | ForEach-Object Name | Sort-Object)
          $ExpectedNames = @($env:ARCHIVE_NAME, "$env:ARCHIVE_NAME.sha256", 'trusted-signing-receipt.json') | Sort-Object
          $OutputEntries = @((Get-Item -LiteralPath $OutputRoot -Force)) + @(Get-ChildItem -LiteralPath $OutputRoot -Force)
          if (($Names -join '|') -cne ($ExpectedNames -join '|') -or @(Get-ChildItem -LiteralPath $OutputRoot -Directory -Force).Count -ne 0 -or
              @($OutputEntries | Where-Object { ($_.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0 }).Count -ne 0) {
            throw 'Trusted signer output inventory is not exact or contains a reparse point.'
          }
          foreach ($Entry in @((Get-Item -LiteralPath $VaultRoot -Force); Get-ChildItem -LiteralPath $VaultRoot -Recurse -Force)) {
            if (($Entry.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) { throw 'Signer-only vault contains a post-signing reparse point.' }
            Assert-SignerOnlyAcl $Entry.FullName
          }
          $PostOrchestrator = [IO.Path]::GetFullPath($env:AEGIS_VALIDATED_SIGNER_ORCHESTRATOR)
          $PostOrchestratorSignature = Get-AuthenticodeSignature -LiteralPath $PostOrchestrator
          if ((Get-FileHash -Algorithm SHA256 -LiteralPath $PostOrchestrator).Hash.ToLowerInvariant() -cne $env:AEGIS_TRUSTED_SIGNER_ORCHESTRATOR_SHA256 -or
              $PostOrchestratorSignature.Status -ne [Management.Automation.SignatureStatus]::Valid -or -not $PostOrchestratorSignature.SignerCertificate -or
              $PostOrchestratorSignature.SignerCertificate.Thumbprint.ToLowerInvariant() -cne $env:AEGIS_TRUSTED_SIGNER_ORCHESTRATOR_SIGNER_THUMBPRINT) {
            throw 'Trusted signer orchestrator changed during the secret-bearing operation.'
          }
          $Receipt = Get-Content -Raw -LiteralPath $ReceiptPath | ConvertFrom-Json
          $Keys = @($Receipt.PSObject.Properties.Name | Sort-Object)
          $ExpectedKeys = @(
            'allPeSignaturesValid','archiveEntryCount','archiveEntryInventorySha256','archiveExpandedSize','archiveFileCount',
            'archiveName','archiveSha256','certificateStoreAfterSha256','certificateStoreBaselineRestored','certificateStoreBeforeSha256',
            'checksumSha256','ckaStateRemoved','cngProviderAfterSha256','cngProviderBaselineRestored','cngProviderBeforeSha256',
            'credentialTransport','credentialsPassedInArgv','deleteKeyAttempted','deleteKeySucceeded','exactOneSignaturePerPe',
            'githubRunAttempt','githubRunId','inputTreeSha256','keyContainerName','keyProvider','keyUniqueName','machineGuidSha256',
            'orchestratorSha256','orchestratorSignerThumbprint','peFileCount','privateKeyAfterSha256','privateKeyBaselineRestored',
            'privateKeyBeforeSha256','repositoryCodeExecuted','rfc3161Only','schemaVersion','sha256Only','signerAccountSid',
            'signerRunnerName','signerSimpleName','signerThumbprint','sourceCommit'
          ) | Sort-Object
          if (($Keys -join '|') -cne ($ExpectedKeys -join '|') -or $Receipt.schemaVersion -ne 2 -or
              $Receipt.sourceCommit -cne $env:SOURCE_COMMIT -or $Receipt.inputTreeSha256 -cne $env:INPUT_TREE_SHA256 -or
              [string]$Receipt.githubRunId -cne [string]$env:GITHUB_RUN_ID -or [string]$Receipt.githubRunAttempt -cne [string]$env:GITHUB_RUN_ATTEMPT -or
              $Receipt.machineGuidSha256 -cne $env:AEGIS_SIGNER_MACHINE_GUID_SHA256 -or
              $Receipt.signerAccountSid -cne $env:AEGIS_RELEASE_SIGNER_ACCOUNT_SID -or
              $Receipt.signerRunnerName -cne $env:AEGIS_RELEASE_SIGNER_RUNNER_NAME -or
              $Receipt.orchestratorSha256 -cne $env:AEGIS_TRUSTED_SIGNER_ORCHESTRATOR_SHA256 -or
              $Receipt.orchestratorSignerThumbprint -cne $env:AEGIS_TRUSTED_SIGNER_ORCHESTRATOR_SIGNER_THUMBPRINT -or
              $Receipt.archiveName -cne $env:ARCHIVE_NAME -or $Receipt.archiveSha256 -cnotmatch '^[0-9a-f]{64}$' -or
              $Receipt.checksumSha256 -cnotmatch '^[0-9a-f]{64}$' -or $Receipt.signerThumbprint -cnotmatch '^[0-9a-f]{40}$' -or
              $Receipt.signerSimpleName -cnotin @('LAI ZEYU', '来泽宇') -or [int]$Receipt.peFileCount -lt 2 -or
              [int]$Receipt.archiveEntryCount -lt 3 -or [int]$Receipt.archiveEntryCount -gt 20000 -or
              [int]$Receipt.archiveFileCount -lt 2 -or [long]$Receipt.archiveExpandedSize -lt 1 -or [long]$Receipt.archiveExpandedSize -gt 2GB -or
              $Receipt.archiveEntryInventorySha256 -cnotmatch '^[0-9a-f]{64}$' -or
              [string]::IsNullOrWhiteSpace([string]$Receipt.keyProvider) -or [string]$Receipt.keyProvider -match '[\r\n]' -or
              [string]::IsNullOrWhiteSpace([string]$Receipt.keyContainerName) -or [string]$Receipt.keyContainerName -match '[\r\n\\/]' -or
              [string]::IsNullOrWhiteSpace([string]$Receipt.keyUniqueName) -or [IO.Path]::GetFileName([string]$Receipt.keyUniqueName) -cne [string]$Receipt.keyUniqueName -or
              -not $Receipt.allPeSignaturesValid -or -not $Receipt.sha256Only -or -not $Receipt.rfc3161Only -or
              -not $Receipt.exactOneSignaturePerPe -or $Receipt.credentialTransport -cne 'ENVIRONMENT_ONLY_NO_ARGV' -or
              $Receipt.credentialsPassedInArgv -or $Receipt.repositoryCodeExecuted -or -not $Receipt.ckaStateRemoved -or
              -not $Receipt.certificateStoreBaselineRestored -or -not $Receipt.cngProviderBaselineRestored -or
              -not $Receipt.privateKeyBaselineRestored -or -not $Receipt.deleteKeyAttempted -or -not $Receipt.deleteKeySucceeded) {
            throw 'Trusted signer receipt does not prove the no-checkout/no-argv signing and complete CKA/provider/key cleanup contract.'
          }
          foreach ($HashField in @(
            'certificateStoreBeforeSha256','certificateStoreAfterSha256','cngProviderBeforeSha256','cngProviderAfterSha256',
            'privateKeyBeforeSha256','privateKeyAfterSha256'
          )) { if ([string]$Receipt.$HashField -cnotmatch '^[0-9a-f]{64}$') { throw "Trusted signer receipt has malformed $HashField." } }
          if ($Receipt.certificateStoreBeforeSha256 -cne $Receipt.certificateStoreAfterSha256 -or
              $Receipt.cngProviderBeforeSha256 -cne $Receipt.cngProviderAfterSha256 -or
              $Receipt.privateKeyBeforeSha256 -cne $Receipt.privateKeyAfterSha256 -or
              (Get-CertificateInventorySha256) -cne $Receipt.certificateStoreAfterSha256 -or
              (Get-CngProviderInventorySha256) -cne $Receipt.cngProviderAfterSha256 -or
              (Get-PrivateKeyInventorySha256) -cne $Receipt.privateKeyAfterSha256) {
            throw 'Independent post-signing certificate/CNG/private-key inventory does not match the exact restored baselines.'
          }
          $ProviderRegistrations = @(
            'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Cryptography\Defaults\Provider',
            'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\WOW6432Node\Microsoft\Cryptography\Defaults\Provider',
            'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Cryptography\Providers',
            'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\WOW6432Node\Microsoft\Cryptography\Providers',
            'Registry::HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Control\Cryptography\Providers',
            'Registry::HKEY_CURRENT_USER\SOFTWARE\Microsoft\Cryptography\Providers'
          ) | ForEach-Object { Get-ChildItem -LiteralPath $_ -Recurse -ErrorAction SilentlyContinue } | Where-Object { $_.PSChildName -ceq [string]$Receipt.keyProvider }
          if ($ProviderRegistrations.Count -ge 1) {
            try {
              $ReceiptProvider = [Security.Cryptography.CngProvider]::new([string]$Receipt.keyProvider)
              if ([Security.Cryptography.CngKey]::Exists([string]$Receipt.keyContainerName, $ReceiptProvider, [Security.Cryptography.CngKeyOpenOptions]::UserKey)) {
                throw 'Exact signer key container remains after claimed DeleteKey success.'
              }
            } catch {
              throw "Independent exact signer CNG key-container absence check failed: $($_.Exception.Message)"
            }
          }
          foreach ($KeyRoot in @((Join-Path $env:APPDATA 'Microsoft\Crypto\Keys'), (Join-Path $env:APPDATA "Microsoft\Crypto\RSA\$env:AEGIS_RELEASE_SIGNER_ACCOUNT_SID"))) {
            if (Test-Path -LiteralPath (Join-Path $KeyRoot ([string]$Receipt.keyUniqueName))) { throw 'Exact signer key unique-name file remains after cleanup.' }
          }
          $ArchiveHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $Archive).Hash.ToLowerInvariant()
          $ChecksumHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $Checksum).Hash.ToLowerInvariant()
          if ($ArchiveHash -cne $Receipt.archiveSha256 -or $ChecksumHash -cne $Receipt.checksumSha256 -or
              (Get-Content -Raw -LiteralPath $Checksum).Trim() -cne "$ArchiveHash  $env:ARCHIVE_NAME") { throw 'Signed archive/checksum bytes differ from the cleanup receipt.' }
          $Expanded = Join-Path $env:RUNNER_TEMP ("aegis-signer-verify-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT")
          try {
            $ArchiveEvidence = Get-SafeArchiveEvidence -ArchivePath $Archive -ExtractionRoot $Expanded
            if ([int]$ArchiveEvidence.entryCount -ne [int]$Receipt.archiveEntryCount -or
                [int]$ArchiveEvidence.fileCount -ne [int]$Receipt.archiveFileCount -or
                [long]$ArchiveEvidence.expandedSize -ne [long]$Receipt.archiveExpandedSize -or
                [string]$ArchiveEvidence.inventorySha256 -cne [string]$Receipt.archiveEntryInventorySha256) {
              throw 'Signed archive full safe-entry inventory differs from the trusted signer receipt.'
            }
            $Entries = @(Get-ChildItem -LiteralPath $ArchiveEvidence.productRoot -Recurse -Force)
            $Pes = @($Entries | Where-Object {
              if ($_.PSIsContainer -or $_.Length -lt 2) { return $false }
              $Stream = [IO.File]::OpenRead($_.FullName)
              try { return ($Stream.ReadByte() -eq 0x4D -and $Stream.ReadByte() -eq 0x5A) } finally { $Stream.Dispose() }
            })
            if ($Pes.Count -ne [int]$Receipt.peFileCount) { throw 'Signed archive PE inventory differs from the trusted receipt.' }
            foreach ($Pe in $Pes) {
              $Signature = Get-AuthenticodeSignature -LiteralPath $Pe.FullName
              $SimpleName = if ($Signature.SignerCertificate) { $Signature.SignerCertificate.GetNameInfo([Security.Cryptography.X509Certificates.X509NameType]::SimpleName, $false) } else { '' }
              if ($Signature.Status -ne [Management.Automation.SignatureStatus]::Valid -or -not $Signature.SignerCertificate -or -not $Signature.TimeStamperCertificate -or
                  $Signature.SignerCertificate.Thumbprint.ToLowerInvariant() -cne $Receipt.signerThumbprint -or $SimpleName -cne $Receipt.signerSimpleName) { throw "Signed PE failed the built-in WinTrust signer/timestamp check: $($Pe.Name)" }
            }
          } finally { if (Test-Path -LiteralPath $Expanded) { Remove-Item -LiteralPath $Expanded -Recurse -Force } }
          $Residual = @(
            foreach ($Store in @('My', 'Root', 'TrustedPeople')) {
              Get-ChildItem -LiteralPath "Cert:\CurrentUser\$Store" | Where-Object { $_.Thumbprint.ToLowerInvariant() -ceq $Receipt.signerThumbprint }
            }
          )
          if ($Residual.Count -ne 0 -or (Test-Path -LiteralPath (Join-Path $env:APPDATA 'eSignerCKA'))) { throw 'Signer certificate or CKA state remains after the trusted orchestrator cleanup.' }
          $PublicInput = Join-Path $env:RUNNER_TEMP "aegis-signed-public-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          if (Test-Path -LiteralPath $PublicInput) { throw 'Signed public staging must not preexist.' }
          New-Item -ItemType Directory -Path $PublicInput | Out-Null
          Copy-Item -LiteralPath $Archive, $Checksum -Destination $PublicInput
          "AEGIS_SIGNED_PUBLIC_INPUT=$PublicInput" >> $env:GITHUB_ENV
          "archive_name=$env:ARCHIVE_NAME" >> $env:GITHUB_OUTPUT
          "archive_sha256=$ArchiveHash" >> $env:GITHUB_OUTPUT
          "checksum_sha256=$ChecksumHash" >> $env:GITHUB_OUTPUT
          "signer_thumbprint=$($Receipt.signerThumbprint)" >> $env:GITHUB_OUTPUT
          "archive_entry_count=$($Receipt.archiveEntryCount)" >> $env:GITHUB_OUTPUT
          "archive_file_count=$($Receipt.archiveFileCount)" >> $env:GITHUB_OUTPUT
          "archive_expanded_size=$($Receipt.archiveExpandedSize)" >> $env:GITHUB_OUTPUT
          "archive_inventory_sha256=$($Receipt.archiveEntryInventorySha256)" >> $env:GITHUB_OUTPUT

      - name: Upload only signed bytes after signer-state cleanup
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aegis-signed-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/aegis-signed-public-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          include-hidden-files: false

      - name: Remove the exact private build-to-signer handoff and signed staging
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          Set-StrictMode -Version Latest
          $Errors = [Collections.Generic.List[string]]::new()
          try {
            if ($env:HANDOFF_LEAF -cnotmatch '^aegis-github-1\.5\.0-\d+-\d+-[0-9a-f]{12}$') { throw 'Handoff leaf is invalid.' }
            $Root = [IO.Path]::GetFullPath($env:AEGIS_PRIVATE_SIGNING_HANDOFF_ROOT).TrimEnd('\')
            $IngressRoot = [IO.Path]::GetFullPath((Join-Path $Root 'ingress')).TrimEnd('\')
            $VaultRoot = [IO.Path]::GetFullPath((Join-Path $Root 'signer-vault')).TrimEnd('\')
            $Targets = @(
              [IO.Path]::GetFullPath((Join-Path $IngressRoot $env:HANDOFF_LEAF)),
              [IO.Path]::GetFullPath((Join-Path $VaultRoot $env:HANDOFF_LEAF)),
              [IO.Path]::GetFullPath((Join-Path $VaultRoot "$env:HANDOFF_LEAF.claiming"))
            )
            foreach ($Target in $Targets) {
              $ExpectedParent = if ([IO.Path]::GetFileName($Target) -ceq "$env:HANDOFF_LEAF.claiming") { $VaultRoot } elseif ($Target.StartsWith($IngressRoot + '\')) { $IngressRoot } else { $VaultRoot }
              if (-not $Target.StartsWith($ExpectedParent + '\', [StringComparison]::OrdinalIgnoreCase) -or
                  [IO.Path]::GetDirectoryName($Target).TrimEnd('\') -cne $ExpectedParent) { throw 'Private ingress/vault cleanup escaped.' }
              if (Test-Path -LiteralPath $Target) {
                $Entries = @((Get-Item -LiteralPath $Target -Force); Get-ChildItem -LiteralPath $Target -Recurse -Force)
                if (@($Entries | Where-Object { ($_.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0 }).Count -ne 0) { throw 'Private ingress/vault cleanup tree has a reparse point.' }
                Remove-Item -LiteralPath $Target -Recurse -Force
              }
              if (Test-Path -LiteralPath $Target) { throw 'Private ingress/vault handoff remained.' }
            }
          } catch { $Errors.Add("private handoff: $($_.Exception.Message)") }
          try {
            if ($env:AEGIS_SIGNED_PUBLIC_INPUT -and (Test-Path -LiteralPath $env:AEGIS_SIGNED_PUBLIC_INPUT)) {
              $Exact = [IO.Path]::GetFullPath($env:AEGIS_SIGNED_PUBLIC_INPUT)
              $Prefix = [IO.Path]::GetFullPath($env:RUNNER_TEMP).TrimEnd('\') + '\'
              if (-not $Exact.StartsWith($Prefix, [StringComparison]::OrdinalIgnoreCase) -or [IO.Path]::GetFileName($Exact) -cne "aegis-signed-public-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT") { throw 'Signed staging cleanup escaped RUNNER_TEMP.' }
              Remove-Item -LiteralPath $Exact -Recurse -Force
            }
          } catch { $Errors.Add("signed staging: $($_.Exception.Message)") }
          if ($Errors.Count -ne 0) { throw "Signer cleanup failed: $($Errors -join ' | ')" }

  verify-signed:
    name: Verify signed artifact and run two unchanged-byte lifecycle passes
    needs: [build-private-unsigned, sign-private-no-checkout]
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'lzy2767865503-pixel/aegis-forecast' &&
      github.repository_owner == 'lzy2767865503-pixel' &&
      github.actor == 'lzy2767865503-pixel' &&
      github.triggering_actor == 'lzy2767865503-pixel' &&
      github.ref == 'refs/heads/main'
    runs-on: windows-2025
    timeout-minutes: 120
    permissions:
      contents: read
    outputs:
      source_commit: ${{ steps.release_metadata.outputs.source_commit }}
      archive_name: ${{ steps.release_metadata.outputs.archive_name }}
      archive_sha256: ${{ steps.release_metadata.outputs.archive_sha256 }}
      checksum_sha256: ${{ steps.release_metadata.outputs.checksum_sha256 }}
      signer_thumbprint: ${{ steps.release_metadata.outputs.signer_thumbprint }}
      archive_entry_count: ${{ steps.release_metadata.outputs.archive_entry_count }}
      archive_file_count: ${{ steps.release_metadata.outputs.archive_file_count }}
      archive_expanded_size: ${{ steps.release_metadata.outputs.archive_expanded_size }}
      archive_inventory_sha256: ${{ steps.release_metadata.outputs.archive_inventory_sha256 }}
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
      SOURCE_COMMIT: ${{ needs.build-private-unsigned.outputs.source_commit }}
      ARCHIVE_NAME: ${{ needs.sign-private-no-checkout.outputs.archive_name }}
      EXPECTED_ARCHIVE_SHA256: ${{ needs.sign-private-no-checkout.outputs.archive_sha256 }}
      EXPECTED_CHECKSUM_SHA256: ${{ needs.sign-private-no-checkout.outputs.checksum_sha256 }}
      EXPECTED_SIGNER_THUMBPRINT: ${{ needs.sign-private-no-checkout.outputs.signer_thumbprint }}
      EXPECTED_ARCHIVE_ENTRY_COUNT: ${{ needs.sign-private-no-checkout.outputs.archive_entry_count }}
      EXPECTED_ARCHIVE_FILE_COUNT: ${{ needs.sign-private-no-checkout.outputs.archive_file_count }}
      EXPECTED_ARCHIVE_EXPANDED_SIZE: ${{ needs.sign-private-no-checkout.outputs.archive_expanded_size }}
      EXPECTED_ARCHIVE_INVENTORY_SHA256: ${{ needs.sign-private-no-checkout.outputs.archive_inventory_sha256 }}
      AEGIS_TAG_RULESET_ID: "21631608"
      AEGIS_MAIN_RULESET_ID: "21633557"
    steps:
      - name: Check out only the exact immutable tag after all signer secrets are gone
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_tag }}
          persist-credentials: false
      - name: Download the signed same-run artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: aegis-signed-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/github-release
      - name: Revalidate rulesets, exact source/tag, signatures, and frozen hashes
        id: release_metadata
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          Set-StrictMode -Version Latest
          if ($env:RELEASE_TAG -cne 'windows-v1.5.0' -or $env:SOURCE_COMMIT -cnotmatch '^[0-9a-f]{40}$' -or
              $env:ARCHIVE_NAME -cne 'QuantScenarioStudio-by-LAI-ZEYU-1.5.0-x64.zip' -or
              $env:EXPECTED_ARCHIVE_SHA256 -cnotmatch '^[0-9a-f]{64}$' -or $env:EXPECTED_CHECKSUM_SHA256 -cnotmatch '^[0-9a-f]{64}$' -or
              $env:EXPECTED_SIGNER_THUMBPRINT -cnotmatch '^[0-9a-f]{40}$' -or
              $env:EXPECTED_ARCHIVE_ENTRY_COUNT -cnotmatch '^\d{1,5}$' -or $env:EXPECTED_ARCHIVE_FILE_COUNT -cnotmatch '^\d{1,5}$' -or
              $env:EXPECTED_ARCHIVE_EXPANDED_SIZE -cnotmatch '^\d{1,10}$' -or $env:EXPECTED_ARCHIVE_INVENTORY_SHA256 -cnotmatch '^[0-9a-f]{64}$') {
            throw 'Signed verifier inputs are malformed.'
          }
          $Ruleset = & gh api "repos/$env:GITHUB_REPOSITORY/rulesets/$env:AEGIS_MAIN_RULESET_ID" | ConvertFrom-Json
          $Types = @($Ruleset.rules | ForEach-Object type | Sort-Object)
          $Pull = @($Ruleset.rules | Where-Object type -ceq 'pull_request')
          $Status = @($Ruleset.rules | Where-Object type -ceq 'required_status_checks')
          if ($LASTEXITCODE -ne 0 -or [long]$Ruleset.id -ne 21633557 -or $Ruleset.enforcement -cne 'active' -or
              $Ruleset.target -cne 'branch' -or @($Ruleset.bypass_actors).Count -ne 0 -or
              (@($Ruleset.conditions.ref_name.include) -join '|') -cne 'refs/heads/main' -or @($Ruleset.conditions.ref_name.exclude).Count -ne 0 -or
              ($Types -join '|') -cne 'deletion|non_fast_forward|pull_request|required_status_checks' -or
              $Pull.Count -ne 1 -or $Status.Count -ne 1) { throw 'Exact no-bypass protected-main ruleset drifted.' }
          $PullParameters = $Pull[0].parameters
          $PullKeys = @($PullParameters.PSObject.Properties.Name | Sort-Object)
          $ExpectedPullKeys = @('allowed_merge_methods', 'dismiss_stale_reviews_on_push', 'require_code_owner_review', 'require_extra_approval_for_unattributed_changes', 'require_last_push_approval', 'required_approving_review_count', 'required_review_thread_resolution', 'required_reviewers') | Sort-Object
          if (($PullKeys -join '|') -cne ($ExpectedPullKeys -join '|') -or
              (@($PullParameters.allowed_merge_methods | Sort-Object) -join '|') -cne 'merge|rebase|squash' -or
              -not $PullParameters.dismiss_stale_reviews_on_push -or -not $PullParameters.required_review_thread_resolution -or
              $PullParameters.require_code_owner_review -or $PullParameters.require_extra_approval_for_unattributed_changes -or
              $PullParameters.require_last_push_approval -or [int]$PullParameters.required_approving_review_count -ne 0 -or
              @($PullParameters.required_reviewers).Count -ne 0) { throw 'Exact protected-main pull-request policy drifted.' }
          $StatusParameters = $Status[0].parameters
          $StatusKeys = @($StatusParameters.PSObject.Properties.Name | Sort-Object)
          $ExpectedStatusKeys = @('do_not_enforce_on_create', 'required_status_checks', 'strict_required_status_checks_policy') | Sort-Object
          $Checks = @($StatusParameters.required_status_checks)
          $Contexts = @($Checks | ForEach-Object { [string]$_.context } | Sort-Object)
          if (($StatusKeys -join '|') -cne ($ExpectedStatusKeys -join '|') -or
              -not $StatusParameters.strict_required_status_checks_policy -or $StatusParameters.do_not_enforce_on_create -or
              $Checks.Count -ne 2 -or ($Contexts -join '|') -cne 'verify (3.10)|verify (3.12)' -or
              @($Checks | Where-Object { [long]$_.integration_id -ne 15368 }).Count -ne 0 -or
              @($Checks | Where-Object { (@($_.PSObject.Properties.Name | Sort-Object) -join '|') -cne 'context|integration_id' }).Count -ne 0) {
            throw 'Exact strict GitHub Actions required-status-check policy drifted.'
          }
          $TagRuleset = & gh api "repos/$env:GITHUB_REPOSITORY/rulesets/$env:AEGIS_TAG_RULESET_ID" | ConvertFrom-Json
          $TagTypes = @($TagRuleset.rules | ForEach-Object type | Sort-Object)
          if ($LASTEXITCODE -ne 0 -or [long]$TagRuleset.id -ne 21631608 -or $TagRuleset.enforcement -cne 'active' -or
              $TagRuleset.target -cne 'tag' -or @($TagRuleset.bypass_actors).Count -ne 0 -or
              (@($TagRuleset.conditions.ref_name.include) -join '|') -cne 'refs/tags/windows-v*' -or
              @($TagRuleset.conditions.ref_name.exclude).Count -ne 0 -or ($TagTypes -join '|') -cne 'deletion|update') { throw 'Exact tag ruleset drifted.' }
          & git fetch --force origin "refs/tags/$($env:RELEASE_TAG):refs/tags/$($env:RELEASE_TAG)"
          & git fetch --force origin 'refs/heads/main:refs/remotes/origin/main'
          $Head = (& git rev-parse HEAD).Trim().ToLowerInvariant()
          $Tag = (& git rev-parse "$($env:RELEASE_TAG)^{}").Trim().ToLowerInvariant()
          $Main = (& git rev-parse refs/remotes/origin/main).Trim().ToLowerInvariant()
          if ($Head -cne $env:SOURCE_COMMIT -or $Tag -cne $env:SOURCE_COMMIT -or $Main -cne $env:SOURCE_COMMIT) { throw 'Signed artifact source is not the exact immutable tag/current protected main.' }
          $ReleaseRoot = (Resolve-Path -LiteralPath artifacts/github-release).Path
          $Archive = Join-Path $ReleaseRoot $env:ARCHIVE_NAME
          $Checksum = "$Archive.sha256"
          $Files = @(Get-ChildItem -LiteralPath $ReleaseRoot -File -Force)
          if ($Files.Count -ne 2 -or @(Get-ChildItem -LiteralPath $ReleaseRoot -Directory -Force).Count -ne 0 -or
              (Get-FileHash -Algorithm SHA256 -LiteralPath $Archive).Hash.ToLowerInvariant() -cne $env:EXPECTED_ARCHIVE_SHA256 -or
              (Get-FileHash -Algorithm SHA256 -LiteralPath $Checksum).Hash.ToLowerInvariant() -cne $env:EXPECTED_CHECKSUM_SHA256 -or
              (Get-Content -Raw -LiteralPath $Checksum).Trim() -cne "$env:EXPECTED_ARCHIVE_SHA256  $env:ARCHIVE_NAME") { throw 'Signed artifact bytes are not exact.' }
          $Expanded = Join-Path $env:RUNNER_TEMP ("aegis-verify-" + [Guid]::NewGuid().ToString('N'))
          try {
            $ArchiveEvidence = ./scripts/windows/verify-portable-archive.ps1 -ArchivePath $Archive -DestinationPath $Expanded
            if ([int]$ArchiveEvidence.entryCount -ne [int]$env:EXPECTED_ARCHIVE_ENTRY_COUNT -or
                [int]$ArchiveEvidence.fileCount -ne [int]$env:EXPECTED_ARCHIVE_FILE_COUNT -or
                [long]$ArchiveEvidence.expandedSize -ne [long]$env:EXPECTED_ARCHIVE_EXPANDED_SIZE -or
                [string]$ArchiveEvidence.inventorySha256 -cne $env:EXPECTED_ARCHIVE_INVENTORY_SHA256) {
              throw 'Signed ZIP full safe-entry inventory differs from the signer-only receipt lineage.'
            }
            ./scripts/windows/verify-github-signatures.ps1 -Root $ArchiveEvidence.productRoot -ExpectedThumbprint $env:EXPECTED_SIGNER_THUMBPRINT
          } finally { if (Test-Path -LiteralPath $Expanded) { Remove-Item -LiteralPath $Expanded -Recurse -Force } }
          $PSNativeCommandUseErrorActionPreference = $false
          $Probe = @(& gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$env:RELEASE_TAG" 2>&1)
          $ProbeExit = $LASTEXITCODE
          $PSNativeCommandUseErrorActionPreference = $true
          if ($ProbeExit -eq 0 -or ($Probe -join "`n") -notmatch '(?i)\bHTTP\s+404\b') { throw 'Release slot is not provably empty after signed verification.' }
          "source_commit=$env:SOURCE_COMMIT" >> $env:GITHUB_OUTPUT
          "archive_name=$env:ARCHIVE_NAME" >> $env:GITHUB_OUTPUT
          "archive_sha256=$env:EXPECTED_ARCHIVE_SHA256" >> $env:GITHUB_OUTPUT
          "checksum_sha256=$env:EXPECTED_CHECKSUM_SHA256" >> $env:GITHUB_OUTPUT
          "signer_thumbprint=$env:EXPECTED_SIGNER_THUMBPRINT" >> $env:GITHUB_OUTPUT
          "archive_entry_count=$env:EXPECTED_ARCHIVE_ENTRY_COUNT" >> $env:GITHUB_OUTPUT
          "archive_file_count=$env:EXPECTED_ARCHIVE_FILE_COUNT" >> $env:GITHUB_OUTPUT
          "archive_expanded_size=$env:EXPECTED_ARCHIVE_EXPANDED_SIZE" >> $env:GITHUB_OUTPUT
          "archive_inventory_sha256=$env:EXPECTED_ARCHIVE_INVENTORY_SHA256" >> $env:GITHUB_OUTPUT
      - name: Signed same-byte portable lifecycle round 1
        timeout-minutes: 40
        shell: pwsh
        run: ./scripts/windows/verify-github-portable-lifecycle.ps1 -ArchivePath "artifacts/github-release/$env:ARCHIVE_NAME" -QaRound 1
      - name: Signed same-byte portable lifecycle round 2
        timeout-minutes: 40
        shell: pwsh
        run: ./scripts/windows/verify-github-portable-lifecycle.ps1 -ArchivePath "artifacts/github-release/$env:ARCHIVE_NAME" -QaRound 2
      - name: Confirm signed bytes remained frozen after both lifecycle passes
        shell: pwsh
        run: |
          $Archive = "artifacts/github-release/$env:ARCHIVE_NAME"
          if ((Get-FileHash -Algorithm SHA256 -LiteralPath $Archive).Hash.ToLowerInvariant() -cne $env:EXPECTED_ARCHIVE_SHA256 -or
              (Get-FileHash -Algorithm SHA256 -LiteralPath "$Archive.sha256").Hash.ToLowerInvariant() -cne $env:EXPECTED_CHECKSUM_SHA256) { throw 'Signed bytes changed during two-pass lifecycle QA.' }

  publish-release:
    name: Isolated no-checkout exact-ID publisher with rollback
    needs: verify-signed
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'lzy2767865503-pixel/aegis-forecast' &&
      github.repository_owner == 'lzy2767865503-pixel' &&
      github.actor == 'lzy2767865503-pixel' &&
      github.triggering_actor == 'lzy2767865503-pixel' &&
      github.ref == 'refs/heads/main'
    runs-on: windows-2025
    timeout-minutes: 90
    environment: windows-github-release
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
      SOURCE_COMMIT: ${{ needs.verify-signed.outputs.source_commit }}
      EXPECTED_ARCHIVE_NAME: ${{ needs.verify-signed.outputs.archive_name }}
      EXPECTED_ARCHIVE_SHA256: ${{ needs.verify-signed.outputs.archive_sha256 }}
      EXPECTED_CHECKSUM_SHA256: ${{ needs.verify-signed.outputs.checksum_sha256 }}
      EXPECTED_SIGNER_THUMBPRINT: ${{ needs.verify-signed.outputs.signer_thumbprint }}
      EXPECTED_ARCHIVE_ENTRY_COUNT: ${{ needs.verify-signed.outputs.archive_entry_count }}
      EXPECTED_ARCHIVE_FILE_COUNT: ${{ needs.verify-signed.outputs.archive_file_count }}
      EXPECTED_ARCHIVE_EXPANDED_SIZE: ${{ needs.verify-signed.outputs.archive_expanded_size }}
      EXPECTED_ARCHIVE_INVENTORY_SHA256: ${{ needs.verify-signed.outputs.archive_inventory_sha256 }}
      RELEASE_OWNERSHIP_MARKER: '<!-- aegis-publisher:${{ github.run_id }}:${{ github.run_attempt }} -->'
      AEGIS_TAG_RULESET_ID: "21631608"
      AEGIS_MAIN_RULESET_ID: "21633557"
    steps:
      - name: Download the exact same-run signed publication input
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: aegis-signed-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: publisher-input

      - name: Verify, create exact-ID draft, publish, re-download, and rollback on ambiguity
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          Set-StrictMode -Version Latest
          if ($env:RELEASE_TAG -cne 'windows-v1.5.0' -or
              $env:SOURCE_COMMIT -cnotmatch '^[0-9a-f]{40}$' -or
              $env:EXPECTED_ARCHIVE_NAME -cne 'QuantScenarioStudio-by-LAI-ZEYU-1.5.0-x64.zip' -or
              $env:EXPECTED_ARCHIVE_SHA256 -cnotmatch '^[0-9a-f]{64}$' -or
              $env:EXPECTED_CHECKSUM_SHA256 -cnotmatch '^[0-9a-f]{64}$' -or
              $env:EXPECTED_SIGNER_THUMBPRINT -cnotmatch '^[0-9a-f]{40}$' -or
              $env:EXPECTED_ARCHIVE_ENTRY_COUNT -cnotmatch '^\d{1,5}$' -or $env:EXPECTED_ARCHIVE_FILE_COUNT -cnotmatch '^\d{1,5}$' -or
              $env:EXPECTED_ARCHIVE_EXPANDED_SIZE -cnotmatch '^\d{1,10}$' -or $env:EXPECTED_ARCHIVE_INVENTORY_SHA256 -cnotmatch '^[0-9a-f]{64}$' -or
              $env:AEGIS_TAG_RULESET_ID -cne '21631608' -or $env:AEGIS_MAIN_RULESET_ID -cne '21633557' -or
              $env:RELEASE_OWNERSHIP_MARKER -cnotmatch '^<!-- aegis-publisher:\d+:\d+ -->$' -or
              [string]::IsNullOrWhiteSpace($env:GH_TOKEN)) {
            throw 'Isolated publisher inputs are missing or malformed.'
          }
          $InputRoot = (Resolve-Path -LiteralPath ./publisher-input).Path
          $InputRootItem = Get-Item -LiteralPath $InputRoot -Force
          $InputFiles = @(Get-ChildItem -LiteralPath $InputRoot -File -Force)
          $InputDirectories = @(Get-ChildItem -LiteralPath $InputRoot -Directory -Force)
          $Archive = Join-Path $InputRoot $env:EXPECTED_ARCHIVE_NAME
          $Checksum = "$Archive.sha256"
          if (($InputRootItem.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0 -or
              $InputFiles.Count -ne 2 -or $InputDirectories.Count -ne 0 -or
              @($InputFiles | Where-Object { ($_.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0 }).Count -ne 0 -or
              -not (Test-Path -LiteralPath $Archive -PathType Leaf) -or
              -not (Test-Path -LiteralPath $Checksum -PathType Leaf) -or
              (Get-FileHash -Algorithm SHA256 -LiteralPath $Archive).Hash.ToLowerInvariant() -cne $env:EXPECTED_ARCHIVE_SHA256 -or
              (Get-FileHash -Algorithm SHA256 -LiteralPath $Checksum).Hash.ToLowerInvariant() -cne $env:EXPECTED_CHECKSUM_SHA256 -or
              (Get-Content -Raw -LiteralPath $Checksum).Trim() -cne "$env:EXPECTED_ARCHIVE_SHA256  $env:EXPECTED_ARCHIVE_NAME") {
            throw 'Downloaded same-run publication input differs from the tested bytes.'
          }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          Add-Type -AssemblyName System.Security.Cryptography.Pkcs
          $AllowedSimpleNames = @('LAI ZEYU', '来泽宇')
          $CodeSigningOid = '1.3.6.1.5.5.7.3.3'
          $TimeStampingOid = '1.3.6.1.5.5.7.3.8'
          $Sha256Oid = '2.16.840.1.101.3.4.2.1'
          $Rfc3161AttributeOids = @('1.2.840.113549.1.9.16.2.14', '1.3.6.1.4.1.311.3.3.1')
          $LegacyCounterSignatureOid = '1.2.840.113549.1.9.6'
          $ValidatedChainPolicies = [Collections.Generic.HashSet[string]]::new([StringComparer]::OrdinalIgnoreCase)

          function Assert-OnlineCertificateChain {
            param(
              [Parameter(Mandatory = $true)]$Certificate,
              [Parameter(Mandatory = $true)][string]$Label,
              [switch]$IgnoreNotTimeValid
            )
            $PolicyKey = "$($Certificate.Thumbprint)|$([bool]$IgnoreNotTimeValid)"
            if ($ValidatedChainPolicies.Contains($PolicyKey)) { return }
            $Chain = [Security.Cryptography.X509Certificates.X509Chain]::new()
            try {
              $Chain.ChainPolicy.RevocationMode = [Security.Cryptography.X509Certificates.X509RevocationMode]::Online
              $Chain.ChainPolicy.RevocationFlag = [Security.Cryptography.X509Certificates.X509RevocationFlag]::ExcludeRoot
              $Chain.ChainPolicy.VerificationFlags = if ($IgnoreNotTimeValid) {
                [Security.Cryptography.X509Certificates.X509VerificationFlags]::IgnoreNotTimeValid
              } else {
                [Security.Cryptography.X509Certificates.X509VerificationFlags]::NoFlag
              }
              $Chain.ChainPolicy.UrlRetrievalTimeout = [TimeSpan]::FromSeconds(60)
              $Chain.ChainPolicy.DisableCertificateDownloads = $false
              if (-not $Chain.Build($Certificate)) {
                $Statuses = @($Chain.ChainStatus | ForEach-Object { $_.Status.ToString() + ':' + $_.StatusInformation.Trim() })
                throw "$Label online chain/revocation validation failed: $($Statuses -join ', ')"
              }
              [void]$ValidatedChainPolicies.Add($PolicyKey)
            } finally { $Chain.Dispose() }
          }

          function Get-TrustedSignTool {
            $KitsRoot = [IO.Path]::GetFullPath((Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10')).TrimEnd('\')
            $BinRoot = Join-Path $KitsRoot 'bin'
            if (-not (Test-Path -LiteralPath $BinRoot -PathType Container)) { throw 'Versioned Windows SDK bin root is missing.' }
            $Candidates = @(
              Get-ChildItem -LiteralPath $BinRoot -Directory -Force |
                Where-Object { $_.Name -cmatch '^\d+\.\d+\.\d+\.\d+$' } |
                ForEach-Object {
                  $Path = Join-Path $_.FullName 'x64\signtool.exe'
                  if (Test-Path -LiteralPath $Path -PathType Leaf) { Get-Item -LiteralPath $Path -Force }
                }
            )
            if ($Candidates.Count -eq 0) { throw 'No versioned x64 Windows SDK SignTool exists.' }
            $Ranked = @($Candidates | Sort-Object @{ Expression = { [version]$_.Directory.Parent.Name }; Descending = $true })
            $TopVersion = [version]$Ranked[0].Directory.Parent.Name
            $Top = @($Ranked | Where-Object { [version]$_.Directory.Parent.Name -eq $TopVersion })
            if ($Top.Count -ne 1) { throw 'Trusted Windows SDK SignTool resolution is ambiguous.' }
            $Tool = $Top[0]
            $Current = $Tool
            $ReachedRoot = $false
            while ($Current) {
              $CurrentPath = [IO.Path]::GetFullPath($Current.FullName).TrimEnd('\')
              if (($Current.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) { throw 'Windows SDK tool path contains a reparse point.' }
              if ($CurrentPath.Equals($KitsRoot, [StringComparison]::OrdinalIgnoreCase)) {
                $ReachedRoot = $true
                break
              }
              $Current = $Current.Parent
            }
            if (-not $ReachedRoot -or
                $Tool.VersionInfo.OriginalFilename -cne 'signtool.exe' -or
                $Tool.VersionInfo.CompanyName -cne 'Microsoft Corporation') {
              throw 'Resolved SignTool metadata is not exact Microsoft Windows SDK metadata.'
            }
            $Signature = Get-AuthenticodeSignature -LiteralPath $Tool.FullName
            $MicrosoftSimpleName = if ($Signature.SignerCertificate) {
              $Signature.SignerCertificate.GetNameInfo([Security.Cryptography.X509Certificates.X509NameType]::SimpleName, $false)
            } else { '' }
            if ($Signature.Status -ne [Management.Automation.SignatureStatus]::Valid -or -not $Signature.SignerCertificate -or
                -not $Signature.TimeStamperCertificate -or $MicrosoftSimpleName -cnotin @('Microsoft Windows', 'Microsoft Corporation')) {
              throw 'Resolved Windows SDK SignTool is not validly Microsoft-signed and timestamped.'
            }
            Assert-OnlineCertificateChain -Certificate $Signature.SignerCertificate -Label 'Windows SDK SignTool signer' -IgnoreNotTimeValid
            Assert-OnlineCertificateChain -Certificate $Signature.TimeStamperCertificate -Label 'Windows SDK SignTool timestamp authority'
            return $Tool.FullName
          }
          $SignTool = Get-TrustedSignTool

          function Get-MagicKind([string]$Path) {
            $Stream = [IO.File]::OpenRead($Path)
            try {
              if ($Stream.Length -lt 4) { return 'OTHER' }
              $Header = New-Object byte[] 4
              [void]$Stream.Read($Header, 0, 4)
              if ($Header[0] -eq 0x50 -and $Header[1] -eq 0x4B -and $Header[2] -eq 0x03 -and $Header[3] -eq 0x04) { return 'ZIP' }
              if ($Header[0] -ne 0x4D -or $Header[1] -ne 0x5A) { return 'OTHER' }
              if ($Stream.Length -lt 64) { return 'INVALID_MZ' }
              $Stream.Position = 0x3C
              $OffsetBytes = New-Object byte[] 4
              if ($Stream.Read($OffsetBytes, 0, 4) -ne 4) { return 'INVALID_MZ' }
              $Offset = [BitConverter]::ToUInt32($OffsetBytes, 0)
              if ($Offset -gt $Stream.Length - 4) { return 'INVALID_MZ' }
              $Stream.Position = $Offset
              $Signature = New-Object byte[] 4
              if ($Stream.Read($Signature, 0, 4) -eq 4 -and $Signature[0] -eq 0x50 -and $Signature[1] -eq 0x45 -and $Signature[2] -eq 0 -and $Signature[3] -eq 0) { return 'MZ_PE' }
              return 'INVALID_MZ'
            } finally { $Stream.Dispose() }
          }

          function Get-ExactSignatureBlob([string]$Path) {
            $Stream = [IO.File]::Open($Path, [IO.FileMode]::Open, [IO.FileAccess]::Read, [IO.FileShare]::Read)
            $Reader = [IO.BinaryReader]::new($Stream)
            try {
              if ($Stream.Length -lt 256 -or $Reader.ReadUInt16() -ne 0x5A4D) { throw "Not a bounded PE: $Path" }
              $Stream.Position = 0x3C
              $PeOffset = $Reader.ReadInt32()
              if ($PeOffset -lt 0 -or [int64]$PeOffset + 256 -gt $Stream.Length) { throw "Invalid PE offset: $Path" }
              $Stream.Position = $PeOffset
              if ($Reader.ReadUInt32() -ne 0x00004550) { throw "Missing PE signature: $Path" }
              $OptionalHeader = [int64]$PeOffset + 24
              $Stream.Position = [int64]$PeOffset + 20
              $OptionalHeaderSize = [int64]$Reader.ReadUInt16()
              $Stream.Position = $OptionalHeader
              $Magic = $Reader.ReadUInt16()
              $HeaderPolicy = switch ($Magic) {
                0x10B { [pscustomobject]@{ minimumSize = 224; directoryOffset = $OptionalHeader + 96; numberOfDirectoriesOffset = $OptionalHeader + 92 } }
                0x20B { [pscustomobject]@{ minimumSize = 240; directoryOffset = $OptionalHeader + 112; numberOfDirectoriesOffset = $OptionalHeader + 108 } }
                default { throw "Unsupported PE magic: $Path" }
              }
              if ($OptionalHeaderSize -lt [int64]$HeaderPolicy.minimumSize -or
                  $OptionalHeader + $OptionalHeaderSize -gt $Stream.Length -or
                  [int64]$HeaderPolicy.directoryOffset + 40 -gt $OptionalHeader + $OptionalHeaderSize) {
                throw "Truncated PE optional header: $Path"
              }
              $Stream.Position = [int64]$HeaderPolicy.numberOfDirectoriesOffset
              if ($Reader.ReadUInt32() -lt 5) { throw "Missing PE certificate-table directory: $Path" }
              $Stream.Position = [int64]$HeaderPolicy.directoryOffset + 32
              $CertificateOffset = [int64]$Reader.ReadUInt32()
              $CertificateSize = [int64]$Reader.ReadUInt32()
              if ($CertificateOffset -le 0 -or ($CertificateOffset % 8) -ne 0 -or $CertificateSize -lt 8 -or $CertificateSize -gt 16777216 -or $CertificateOffset + $CertificateSize -ne $Stream.Length) { throw "Nonterminal or invalid PE certificate table: $Path" }
              $Stream.Position = $CertificateOffset
              $CertificateLength = [int64]$Reader.ReadUInt32()
              $Revision = $Reader.ReadUInt16()
              $Type = $Reader.ReadUInt16()
              if ($CertificateLength -lt 8 -or $CertificateLength -gt $CertificateSize -or $Type -ne 2 -or $Revision -notin @(0x0100, 0x0200) -or
                  (($CertificateLength + 7) -band (-bnot 7)) -ne $CertificateSize) { throw "PE does not contain exactly one aligned PKCS#7 WIN_CERTIFICATE: $Path" }
              $Blob = $Reader.ReadBytes([int]($CertificateLength - 8))
              if ($Blob.Length -ne [int]($CertificateLength - 8)) { throw "Truncated PE signature blob: $Path" }
              $Padding = $Reader.ReadBytes([int]($CertificateSize - $CertificateLength))
              if ($Padding.Length -ne [int]($CertificateSize - $CertificateLength) -or @($Padding | Where-Object { $_ -ne 0 }).Count -ne 0) { throw "Truncated or non-zero PE signature padding: $Path" }
              return $Blob
            } finally { $Reader.Dispose(); $Stream.Dispose() }
          }

          function Invoke-SignToolVerify([string]$Path, [switch]$Verbose) {
            $Arguments = [Collections.Generic.List[string]]::new()
            foreach ($Argument in @('verify', '/pa', '/all', '/tw')) { $Arguments.Add($Argument) }
            if ($Verbose) { $Arguments.Add('/v') }
            $Arguments.Add($Path)
            $Info = [Diagnostics.ProcessStartInfo]::new()
            $Info.FileName = $SignTool
            $Info.UseShellExecute = $false
            $Info.CreateNoWindow = $true
            $Info.RedirectStandardOutput = $true
            $Info.RedirectStandardError = $true
            foreach ($Argument in $Arguments) { [void]$Info.ArgumentList.Add($Argument) }
            $Process = [Diagnostics.Process]::new()
            $Process.StartInfo = $Info
            try {
              if (-not $Process.Start()) { throw "SignTool did not start: $Path" }
              $Stdout = $Process.StandardOutput.ReadToEndAsync()
              $Stderr = $Process.StandardError.ReadToEndAsync()
              if (-not $Process.WaitForExit(180000)) {
                try { $Process.Kill($true) } catch { }
                if (-not $Process.WaitForExit(30000)) { throw "SignTool tree remained after timeout: $Path" }
                throw "SignTool exceeded its hard timeout: $Path"
              }
              $Tasks = [Threading.Tasks.Task[]]@($Stdout, $Stderr)
              if (-not [Threading.Tasks.Task]::WaitAll($Tasks, 30000)) { throw "SignTool output pipes remained: $Path" }
              $Output = $Stdout.GetAwaiter().GetResult() + [Environment]::NewLine + $Stderr.GetAwaiter().GetResult()
              if ($Process.ExitCode -ne 0) { throw "SignTool rejected $Path with exit code $($Process.ExitCode)." }
              return $Output
            } finally { $Process.Dispose() }
          }

          function Assert-ExactPeSignature([string]$Path) {
            $Cms = [Security.Cryptography.Pkcs.SignedCms]::new()
            $Cms.Decode((Get-ExactSignatureBlob $Path))
            if ($Cms.SignerInfos.Count -ne 1) { throw "PE must have exactly one primary signer: $Path" }
            $SignerInfo = $Cms.SignerInfos[0]
            if ($SignerInfo.DigestAlgorithm.Value -cne $Sha256Oid -or -not $SignerInfo.Certificate) { throw "PE signer is missing or not SHA-256: $Path" }
            $UnsignedOids = @($SignerInfo.UnsignedAttributes | ForEach-Object { $_.Oid.Value })
            if (@($UnsignedOids | Where-Object { $Rfc3161AttributeOids -ccontains $_ }).Count -ne 1 -or $UnsignedOids -ccontains $LegacyCounterSignatureOid) {
              throw "PE must have exactly one RFC3161 attribute and no legacy countersignature: $Path"
            }
            if ($SignerInfo.Certificate.Thumbprint.ToLowerInvariant() -cne $env:EXPECTED_SIGNER_THUMBPRINT) { throw "CMS signer thumbprint changed: $Path" }
            $Compact = Invoke-SignToolVerify -Path $Path
            $Verbose = Invoke-SignToolVerify -Path $Path -Verbose
            $Rows = [regex]::Matches($Compact, '(?im)^\s*(?<index>\d+)\s+(?<algorithm>sha(?:1|256|384|512))\s+(?<timestamp>\S+)\s*$')
            $Indexes = [regex]::Matches($Verbose, '(?im)^\s*Signature Index:\s*(?<index>\d+)(?:\s|$)')
            $FileHashes = [regex]::Matches($Verbose, '(?im)^\s*Hash of file \((?<algorithm>[^)]+)\):\s*[0-9a-f]{64}\s*$')
            if ($Rows.Count -ne 1 -or $Rows[0].Groups['index'].Value -cne '0' -or
                $Rows[0].Groups['algorithm'].Value.ToLowerInvariant() -cne 'sha256' -or
                $Rows[0].Groups['timestamp'].Value.ToUpperInvariant() -cne 'RFC3161' -or
                $Indexes.Count -ne 1 -or $Indexes[0].Groups['index'].Value -cne '0' -or
                $FileHashes.Count -ne 1 -or $FileHashes[0].Groups['algorithm'].Value.ToLowerInvariant() -cne 'sha256' -or
                [regex]::Matches($Verbose, '(?im)^\s*Number of (?:files|signatures) successfully Verified:\s*1\s*$').Count -ne 1 -or
                $Verbose -notmatch '(?im)^\s*Number of warnings:\s*0\s*$' -or $Verbose -notmatch '(?im)^\s*Number of errors:\s*0\s*$') {
              throw "SignTool did not prove exactly one warning-free SHA-256/RFC3161 signature index 0: $Path"
            }
            $Signature = Get-AuthenticodeSignature -LiteralPath $Path
            if ($Signature.Status -ne [Management.Automation.SignatureStatus]::Valid -or -not $Signature.SignerCertificate -or -not $Signature.TimeStamperCertificate) { throw "WinTrust signature or timestamp is invalid: $Path" }
            $Signer = $Signature.SignerCertificate
            $SimpleName = $Signer.GetNameInfo([Security.Cryptography.X509Certificates.X509NameType]::SimpleName, $false)
            if ($SimpleName -cnotin $AllowedSimpleNames -or $Signer.Thumbprint.ToLowerInvariant() -cne $env:EXPECTED_SIGNER_THUMBPRINT -or
                $Signer.Thumbprint -cne $SignerInfo.Certificate.Thumbprint -or $Signer.Subject -ceq $Signer.Issuer -or
                -not (@($Signer.EnhancedKeyUsageList) | Where-Object { $_.ObjectId.Value -ceq $CodeSigningOid })) {
              throw "PE is not signed by the one exact publicly trusted LAI signer: $Path"
            }
            $TimeStamper = $Signature.TimeStamperCertificate
            $TimestampEkus = @($TimeStamper.EnhancedKeyUsageList | ForEach-Object { $_.ObjectId.Value })
            if ($TimeStamper.Subject -ceq $TimeStamper.Issuer -or $TimestampEkus.Count -ne 1 -or $TimestampEkus[0] -cne $TimeStampingOid) { throw "PE timestamp authority is invalid: $Path" }
            Assert-OnlineCertificateChain -Certificate $Signer -Label "$(Split-Path -Leaf $Path) signer"
            Assert-OnlineCertificateChain -Certificate $TimeStamper -Label "$(Split-Path -Leaf $Path) timestamp authority"
          }

          function Assert-NestedZipHasNoExecutable([string]$Path) {
            $Zip = [IO.Compression.ZipFile]::OpenRead($Path)
            $Total = [long]0
            try {
              $Seen = [Collections.Generic.HashSet[string]]::new([StringComparer]::OrdinalIgnoreCase)
              foreach ($Entry in $Zip.Entries) {
                $Name = $Entry.FullName.Replace('\', '/')
                if ([string]::IsNullOrWhiteSpace($Name) -or [IO.Path]::IsPathRooted($Name) -or $Name.Split('/') -contains '..' -or -not $Seen.Add($Name.TrimEnd('/'))) { throw 'Nested ZIP has an unsafe or duplicate path.' }
                if ((($Entry.ExternalAttributes -shr 16) -band 0xF000) -eq 0xA000) { throw 'Nested ZIP has a symlink.' }
                $Total += [long]$Entry.Length
                if ($Entry.Length -gt 134217728 -or $Total -gt 1073741824) { throw 'Nested ZIP exceeds the inspection bound.' }
                if ($Entry.Length -eq 0) { continue }
                $EntryStream = $Entry.Open()
                try {
                  $Header = New-Object byte[] 4
                  $Read = $EntryStream.Read($Header, 0, 4)
                  if ($Read -ge 2 -and $Header[0] -eq 0x4D -and $Header[1] -eq 0x5A) { throw "Nested ZIP embeds MZ: $Name" }
                  if ($Read -eq 4 -and $Header[0] -eq 0x50 -and $Header[1] -eq 0x4B -and $Header[2] -eq 0x03 -and $Header[3] -eq 0x04) { throw "Nested ZIP embeds an archive: $Name" }
                } finally { $EntryStream.Dispose() }
              }
            } finally { $Zip.Dispose() }
          }

          function Get-StrictPublisherArchiveEvidence([string]$ArchivePath) {
            $ProductDirectory = 'QuantScenarioStudio-by-LAI-ZEYU-1.5.0-x64'
            $Prefix = "$ProductDirectory/"
            $ArchiveItem = Get-Item -LiteralPath $ArchivePath -Force
            if (($ArchiveItem.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0 -or $ArchiveItem.Length -lt 1KB -or $ArchiveItem.Length -gt 1GB) {
              throw 'Publisher ZIP file boundary is invalid.'
            }
            $ArchiveAncestor = $ArchiveItem.Directory
            while ($ArchiveAncestor) {
              if (($ArchiveAncestor.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) { throw 'Publisher ZIP path has a reparse-point ancestor.' }
              $ArchiveAncestor = $ArchiveAncestor.Parent
            }
            $Zip = [IO.Compression.ZipFile]::OpenRead($ArchivePath)
            $Seen = [Collections.Generic.HashSet[string]]::new([StringComparer]::OrdinalIgnoreCase)
            $PathNodes = [Collections.Generic.Dictionary[string, object]]::new([StringComparer]::OrdinalIgnoreCase)
            $Rows = [Collections.Generic.List[object]]::new()
            [long]$ExpandedSize = 0
            $FileCount = 0
            try {
              if ($Zip.Entries.Count -lt 2 -or $Zip.Entries.Count -gt 20000) { throw 'Publisher ZIP entry count is outside the strict bound.' }
              foreach ($Entry in $Zip.Entries) {
                $OriginalName = $Entry.FullName
                $Name = $OriginalName.Replace('\', '/')
                $IsDirectory = $Name.EndsWith('/')
                $PathText = if ($IsDirectory) { $Name.TrimEnd('/') } else { $Name }
                $Segments = @($PathText.Split('/'))
                if ([string]::IsNullOrWhiteSpace($Name) -or $OriginalName -cne $Name -or $Name.Length -gt 4096 -or $Name.StartsWith('/') -or $Name.Contains(':') -or $Name.Contains('//') -or
                    $Name.IndexOfAny([char[]]@(0..31)) -ge 0 -or
                    $Name -cne $Name.Normalize([Text.NormalizationForm]::FormC) -or
                    (-not $Name.StartsWith($Prefix, [StringComparison]::Ordinal) -and $Name -cne $Prefix) -or
                    @($Segments | Where-Object { [string]::IsNullOrWhiteSpace($_) -or $_ -in @('.', '..') -or $_.Length -gt 255 -or $_.Trim() -cne $_ -or $_.TrimEnd(' ', '.') -cne $_ -or $_ -match '^(?i:CON|PRN|AUX|NUL|COM[1-9]|LPT[1-9])(?:\..*)?$' }).Count -ne 0 -or
                    -not $Seen.Add($Name.TrimEnd('/'))) { throw "Publisher ZIP has traversal, root-level, duplicate, case-colliding, or noncanonical entry: $Name" }
                for ($NodeIndex = 0; $NodeIndex -lt $Segments.Count; $NodeIndex++) {
                  $NodePath = @($Segments[0..$NodeIndex]) -join '/'
                  $NodeKind = if ($NodeIndex -eq ($Segments.Count - 1) -and -not $IsDirectory) { 'file' } else { 'directory' }
                  if ($PathNodes.ContainsKey($NodePath)) {
                    $ExistingNode = $PathNodes[$NodePath]
                    if ([string]$ExistingNode.path -cne $NodePath -or [string]$ExistingNode.type -cne $NodeKind) { throw "Publisher ZIP has an implicit directory case collision or file/directory conflict: $NodePath" }
                  } else { $PathNodes.Add($NodePath, [ordered]@{ path = $NodePath; type = $NodeKind }) }
                }
                $External = [uint32]([int64]$Entry.ExternalAttributes -band 0xffffffffL)
                $UnixType = ($External -shr 16) -band 0xF000
                if ($UnixType -eq 0xA000 -or $UnixType -notin @(0, 0x4000, 0x8000) -or
                    ($IsDirectory -and $UnixType -notin @(0, 0x4000)) -or (-not $IsDirectory -and $UnixType -eq 0x4000) -or
                    (($External -band 0xFFFF) -band [uint32][IO.FileAttributes]::ReparsePoint) -ne 0) { throw "Publisher ZIP has a symlink/reparse entry: $Name" }
                if ($IsDirectory) {
                  if ($Entry.Length -ne 0) { throw "Publisher ZIP directory entry has content: $Name" }
                  $Rows.Add([ordered]@{ path = $Name; type = 'directory'; size = 0; sha256 = '-' })
                  continue
                }
                $ExpandedSize += [long]$Entry.Length
                if ($Entry.Length -gt 512MB -or $ExpandedSize -gt 2GB) { throw 'Publisher ZIP expanded-size bound was exceeded.' }
                $Stream = $Entry.Open()
                try { $Hash = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($Stream)).ToLowerInvariant() } finally { $Stream.Dispose() }
                $Rows.Add([ordered]@{ path = $Name; type = 'file'; size = [long]$Entry.Length; sha256 = $Hash })
                $FileCount++
              }
            } finally { $Zip.Dispose() }
            if ($FileCount -lt 2 -or -not $PathNodes.ContainsKey($ProductDirectory) -or
                [string]$PathNodes[$ProductDirectory].path -cne $ProductDirectory -or [string]$PathNodes[$ProductDirectory].type -cne 'directory') {
              throw 'Publisher ZIP lacks one exact product prefix and bounded files.'
            }
            $InventoryText = (@($Rows | Sort-Object path | ForEach-Object { "$($_.type)`t$($_.size)`t$($_.sha256)`t$($_.path)" }) -join "`n") + "`n"
            $InventoryHash = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData([Text.Encoding]::UTF8.GetBytes($InventoryText))).ToLowerInvariant()
            return [pscustomobject]@{
              entryCount = $Rows.Count; fileCount = $FileCount; expandedSize = $ExpandedSize; inventorySha256 = $InventoryHash
              files = @($Rows | Where-Object type -ceq 'file' | Sort-Object path); extractedNodes = @($PathNodes.Values | Sort-Object path)
            }
          }

          function Assert-ArchiveSignatures([string]$ArchivePath, [string]$Phase) {
            $Root = Join-Path $env:RUNNER_TEMP ("aegis-publisher-$Phase-" + [Guid]::NewGuid().ToString('N'))
            try {
              $ArchiveEvidence = Get-StrictPublisherArchiveEvidence $ArchivePath
              if ([int]$ArchiveEvidence.entryCount -ne [int]$env:EXPECTED_ARCHIVE_ENTRY_COUNT -or
                  [int]$ArchiveEvidence.fileCount -ne [int]$env:EXPECTED_ARCHIVE_FILE_COUNT -or
                  [long]$ArchiveEvidence.expandedSize -ne [long]$env:EXPECTED_ARCHIVE_EXPANDED_SIZE -or
                  [string]$ArchiveEvidence.inventorySha256 -cne $env:EXPECTED_ARCHIVE_INVENTORY_SHA256) {
                throw "ZIP full safe-entry inventory differs from twice-verified lineage during $Phase."
              }
              $ExtractionAncestor = Get-Item -LiteralPath ([IO.Path]::GetDirectoryName([IO.Path]::GetFullPath($Root))) -Force
              while ($ExtractionAncestor) {
                if (($ExtractionAncestor.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) { throw "ZIP extraction path has a reparse-point ancestor during $Phase." }
                $ExtractionAncestor = $ExtractionAncestor.Parent
              }
              Expand-Archive -LiteralPath $ArchivePath -DestinationPath $Root
              if ((Get-FileHash -Algorithm SHA256 -LiteralPath $ArchivePath).Hash.ToLowerInvariant() -cne $env:EXPECTED_ARCHIVE_SHA256) {
                throw "ZIP changed during strict validation/extraction in $Phase."
              }
              $RootChildren = @(Get-ChildItem -LiteralPath $Root -Force)
              if ($RootChildren.Count -ne 1 -or -not $RootChildren[0].PSIsContainer -or $RootChildren[0].Name -cne 'QuantScenarioStudio-by-LAI-ZEYU-1.5.0-x64') { throw "ZIP top-level schema has an extra root file or wrong directory during $Phase." }
              $Entries = @(Get-ChildItem -LiteralPath $RootChildren[0].FullName -Recurse -Force)
              if (@($Entries | Where-Object { ($_.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0 }).Count -ne 0) { throw "ZIP contains a reparse point during $Phase." }
              $ActualNodes = @((Get-Item -LiteralPath $RootChildren[0].FullName -Force); $Entries) | ForEach-Object {
                [ordered]@{ path = [IO.Path]::GetRelativePath($Root, $_.FullName).Replace('\', '/'); type = if ($_.PSIsContainer) { 'directory' } else { 'file' } }
              } | Sort-Object path
              $ExpectedNodes = @($ArchiveEvidence.extractedNodes)
              if ($ActualNodes.Count -ne $ExpectedNodes.Count) { throw "ZIP full extraction node count differs during $Phase." }
              for ($NodeIndex = 0; $NodeIndex -lt $ExpectedNodes.Count; $NodeIndex++) {
                if ([string]$ActualNodes[$NodeIndex].path -cne [string]$ExpectedNodes[$NodeIndex].path -or
                    [string]$ActualNodes[$NodeIndex].type -cne [string]$ExpectedNodes[$NodeIndex].type) {
                  throw "ZIP full extraction node inventory differs during $Phase`: $([string]$ActualNodes[$NodeIndex].path)"
                }
              }
              $ActualFiles = @($Entries | Where-Object { -not $_.PSIsContainer } | Sort-Object FullName)
              if ($ActualFiles.Count -ne @($ArchiveEvidence.files).Count) { throw "ZIP extracted file count differs during $Phase." }
              for ($Index = 0; $Index -lt $ActualFiles.Count; $Index++) {
                $Relative = [IO.Path]::GetRelativePath($Root, $ActualFiles[$Index].FullName).Replace('\', '/')
                $Expected = @($ArchiveEvidence.files)[$Index]
                if ($Relative -cne [string]$Expected.path -or $ActualFiles[$Index].Length -ne [long]$Expected.size -or
                    (Get-FileHash -Algorithm SHA256 -LiteralPath $ActualFiles[$Index].FullName).Hash.ToLowerInvariant() -cne [string]$Expected.sha256) {
                  throw "ZIP full extraction inventory differs during $Phase`: $Relative"
                }
              }
              $PeFiles = [Collections.Generic.List[IO.FileInfo]]::new()
              foreach ($File in @($Entries | Where-Object { -not $_.PSIsContainer })) {
                $Kind = Get-MagicKind $File.FullName
                if ($Kind -ceq 'INVALID_MZ') { throw "ZIP contains an invalid MZ during $Phase." }
                if ($Kind -ceq 'ZIP') { Assert-NestedZipHasNoExecutable $File.FullName }
                if ($Kind -ceq 'MZ_PE') { $PeFiles.Add($File) }
              }
              if ($PeFiles.Count -lt 2) { throw "ZIP contains too few discoverable PEs during $Phase." }
              foreach ($PeFile in $PeFiles) { Assert-ExactPeSignature $PeFile.FullName }
            } finally { if (Test-Path -LiteralPath $Root) { Remove-Item -LiteralPath $Root -Recurse -Force } }
          }
          Assert-ArchiveSignatures -ArchivePath $Archive -Phase 'same-run-input'

          $ExpectedReleaseTitle = 'Quant Scenario Studio by LAI ZEYU 1.5.0 for Windows'
          $ExpectedReleaseNotes = 'Created and authored by LAI ZEYU（来泽宇）. This portable ZIP is separate from the private unsigned Microsoft Store handoff. Every recursively discovered Windows PE has exactly one publicly trusted SHA-256/RFC 3161 Authenticode signature by LAI ZEYU or 来泽宇, and these unchanged ZIP bytes passed two complete UI/API/watchdog/cleanup lifecycle rounds.'
          $ExpectedReleaseBody = "$ExpectedReleaseNotes`n`n$env:RELEASE_OWNERSHIP_MARKER"
          $ApiBase = "https://api.github.com/repos/$env:GITHUB_REPOSITORY"
          $ApiHeaders = @{
            Accept = 'application/vnd.github+json'
            Authorization = "Bearer $env:GH_TOKEN"
            'X-GitHub-Api-Version' = '2022-11-28'
            'User-Agent' = 'aegis-exact-id-protected-publisher'
          }

          function Invoke-GitHubJsonRequest {
            param(
              [Parameter(Mandatory = $true)][ValidateSet('GET', 'POST', 'PATCH')][string]$Method,
              [Parameter(Mandatory = $true)][string]$Uri,
              [Parameter(Mandatory = $true)][int[]]$ExpectedStatus,
              [object]$Body = $null
            )
            $Parameters = @{ Uri = $Uri; Method = $Method; Headers = $ApiHeaders; SkipHttpErrorCheck = $true; TimeoutSec = 120 }
            if ($null -ne $Body) { $Parameters.ContentType = 'application/json'; $Parameters.Body = $Body | ConvertTo-Json -Depth 8 -Compress }
            $Response = Invoke-WebRequest @Parameters
            $Status = [int]$Response.StatusCode
            if ($Status -notin $ExpectedStatus) {
              $Detail = [string]$Response.Content
              if ($Detail.Length -gt 1000) { $Detail = $Detail.Substring(0, 1000) }
              throw "GitHub REST $Method $Uri returned HTTP $Status`: $Detail"
            }
            if ([string]::IsNullOrWhiteSpace([string]$Response.Content)) { return $null }
            try { return ([string]$Response.Content | ConvertFrom-Json) } catch { throw "GitHub REST $Method $Uri returned malformed JSON." }
          }

          function Get-ReleaseByTagOrNull {
            $Matches = [Collections.Generic.List[object]]::new()
            $Complete = $false
            foreach ($Page in 1..10) {
              $Releases = @(Invoke-GitHubJsonRequest -Method 'GET' -Uri "$ApiBase/releases?per_page=100&page=$Page" -ExpectedStatus @(200))
              if ($Releases.Count -gt 100) { throw 'GitHub returned an oversized Release page.' }
              foreach ($Release in $Releases) { if ([string]$Release.tag_name -ceq $env:RELEASE_TAG) { $Matches.Add($Release) } }
              if ($Releases.Count -lt 100) { $Complete = $true; break }
            }
            if (-not $Complete) { throw 'Release listing exceeded the strict 1,000-item bound.' }
            if ($Matches.Count -gt 1) { throw 'Multiple visible Releases claim the selected tag.' }
            if ($Matches.Count -eq 0) { return $null }
            return $Matches[0]
          }

          function Get-ReleaseByIdOrNull([long]$ReleaseId) {
            $Response = Invoke-WebRequest -Uri "$ApiBase/releases/$ReleaseId" -Method 'GET' -Headers $ApiHeaders -SkipHttpErrorCheck -TimeoutSec 120
            $Status = [int]$Response.StatusCode
            if ($Status -eq 404) { return $null }
            if ($Status -ne 200) { throw "Exact-ID Release GET returned HTTP $Status." }
            try { $Release = [string]$Response.Content | ConvertFrom-Json } catch { throw 'Exact-ID Release GET returned malformed JSON.' }
            if ([long]$Release.id -ne $ReleaseId) { throw 'Exact-ID Release GET returned a different ID.' }
            return $Release
          }

          function Assert-OwnedRelease {
            param(
              [Parameter(Mandatory = $true)]$Release,
              [Parameter(Mandatory = $true)][long]$ExpectedId,
              [Parameter(Mandatory = $true)][DateTimeOffset]$CreatedNotBefore,
              [ValidateSet('any', 'draft', 'public')][string]$ExpectedVisibility = 'any'
            )
            try {
              $CreatedAt = [DateTimeOffset]::Parse([string]$Release.created_at, [Globalization.CultureInfo]::InvariantCulture, [Globalization.DateTimeStyles]::AssumeUniversal)
            } catch { throw 'Release created_at is missing or malformed.' }
            if ($null -eq $OwnedReleaseId -or $null -eq $OwnedReleaseCreatedAt -or [string]::IsNullOrWhiteSpace($OwnedReleaseNodeId) -or
                [long]$Release.id -ne $ExpectedId -or $ExpectedId -ne [long]$OwnedReleaseId -or $ExpectedId -le 0 -or
                [string]$Release.node_id -cne [string]$OwnedReleaseNodeId -or
                $CreatedAt.ToUniversalTime() -ne $OwnedReleaseCreatedAt.ToUniversalTime() -or
                [string]$Release.url -cne "$ApiBase/releases/$ExpectedId") {
              throw 'Release no longer has the immutable id/node_id/created_at identity established by this run one successful HTTP 201 response.'
            }
            if ([string]$Release.tag_name -cne $env:RELEASE_TAG -or
                [string]$Release.name -cne $ExpectedReleaseTitle -or [string]$Release.body -cne $ExpectedReleaseBody -or
                [string]$Release.author.login -cne 'github-actions[bot]' -or $Release.prerelease -ne $false -or
                $CreatedAt -lt $CreatedNotBefore -or $CreatedAt -gt [DateTimeOffset]::UtcNow.AddMinutes(5)) {
              throw 'The exact owned Release mutable publication state, author, tag, or creation window drifted.'
            }
            if (($ExpectedVisibility -ceq 'draft' -and $Release.draft -ne $true) -or
                ($ExpectedVisibility -ceq 'public' -and $Release.draft -ne $false)) {
              throw "Owned Release visibility is not $ExpectedVisibility."
            }
          }

          function Get-OwnedRelease {
            param(
              [Parameter(Mandatory = $true)][long]$ReleaseId,
              [Parameter(Mandatory = $true)][DateTimeOffset]$CreatedNotBefore,
              [ValidateSet('any', 'draft', 'public')][string]$ExpectedVisibility = 'any'
            )
            $Release = Get-ReleaseByIdOrNull $ReleaseId
            if (-not $Release) { throw "Owned Release ID $ReleaseId no longer exists." }
            Assert-OwnedRelease -Release $Release -ExpectedId $ReleaseId -CreatedNotBefore $CreatedNotBefore -ExpectedVisibility $ExpectedVisibility
            return $Release
          }

          function Get-RemoteTagCommit {
            $EncodedTag = [Uri]::EscapeDataString($env:RELEASE_TAG)
            $Reference = Invoke-GitHubJsonRequest -Method 'GET' -Uri "$ApiBase/git/ref/tags/$EncodedTag" -ExpectedStatus @(200)
            if ([string]$Reference.ref -cne "refs/tags/$env:RELEASE_TAG") { throw 'Tag-ref response is not the exact selected tag.' }
            $ObjectType = [string]$Reference.object.type
            $ObjectSha = ([string]$Reference.object.sha).ToLowerInvariant()
            foreach ($Depth in 1..4) {
              if ($ObjectSha -cnotmatch '^[0-9a-f]{40}$') { throw 'Release ref SHA is malformed.' }
              if ($ObjectType -ceq 'commit') { return $ObjectSha }
              if ($ObjectType -cne 'tag') { throw 'Release ref does not resolve to a commit or annotated tag.' }
              $TagObject = Invoke-GitHubJsonRequest -Method 'GET' -Uri "$ApiBase/git/tags/$ObjectSha" -ExpectedStatus @(200)
              if ([string]$TagObject.sha -cne $ObjectSha) { throw 'Annotated-tag response does not bind the requested object.' }
              $ObjectType = [string]$TagObject.object.type
              $ObjectSha = ([string]$TagObject.object.sha).ToLowerInvariant()
            }
            throw 'Annotated release tag nesting exceeded the strict bound.'
          }

          function Assert-RepositoryRulesets {
            $Tag = Invoke-GitHubJsonRequest -Method 'GET' -Uri "$ApiBase/rulesets/$env:AEGIS_TAG_RULESET_ID" -ExpectedStatus @(200)
            $TagTypes = @($Tag.rules | ForEach-Object type | Sort-Object)
            if ([long]$Tag.id -ne 21631608 -or $Tag.enforcement -cne 'active' -or $Tag.target -cne 'tag' -or
                @($Tag.bypass_actors).Count -ne 0 -or (@($Tag.conditions.ref_name.include) -join '|') -cne 'refs/tags/windows-v*' -or
                @($Tag.conditions.ref_name.exclude).Count -ne 0 -or ($TagTypes -join '|') -cne 'deletion|update') {
              throw 'Exact protected Windows tag ruleset drifted.'
            }
            $Main = Invoke-GitHubJsonRequest -Method 'GET' -Uri "$ApiBase/rulesets/$env:AEGIS_MAIN_RULESET_ID" -ExpectedStatus @(200)
            $MainTypes = @($Main.rules | ForEach-Object type | Sort-Object)
            $PullRules = @($Main.rules | Where-Object type -ceq 'pull_request')
            $StatusRules = @($Main.rules | Where-Object type -ceq 'required_status_checks')
            if ([long]$Main.id -ne 21633557 -or $Main.enforcement -cne 'active' -or $Main.target -cne 'branch' -or
                @($Main.bypass_actors).Count -ne 0 -or (@($Main.conditions.ref_name.include) -join '|') -cne 'refs/heads/main' -or
                @($Main.conditions.ref_name.exclude).Count -ne 0 -or ($MainTypes -join '|') -cne 'deletion|non_fast_forward|pull_request|required_status_checks' -or
                $PullRules.Count -ne 1 -or $StatusRules.Count -ne 1) {
              throw 'Exact protected-main ruleset drifted.'
            }
            $PullParameters = $PullRules[0].parameters
            $PullKeys = @($PullParameters.PSObject.Properties.Name | Sort-Object)
            $ExpectedPullKeys = @('allowed_merge_methods', 'dismiss_stale_reviews_on_push', 'require_code_owner_review', 'require_extra_approval_for_unattributed_changes', 'require_last_push_approval', 'required_approving_review_count', 'required_review_thread_resolution', 'required_reviewers') | Sort-Object
            if (($PullKeys -join '|') -cne ($ExpectedPullKeys -join '|') -or
                (@($PullParameters.allowed_merge_methods | Sort-Object) -join '|') -cne 'merge|rebase|squash' -or
                -not $PullParameters.dismiss_stale_reviews_on_push -or -not $PullParameters.required_review_thread_resolution -or
                $PullParameters.require_code_owner_review -or $PullParameters.require_extra_approval_for_unattributed_changes -or
                $PullParameters.require_last_push_approval -or [int]$PullParameters.required_approving_review_count -ne 0 -or
                @($PullParameters.required_reviewers).Count -ne 0) {
              throw 'Exact protected-main pull-request policy drifted.'
            }
            $StatusParameters = $StatusRules[0].parameters
            $StatusKeys = @($StatusParameters.PSObject.Properties.Name | Sort-Object)
            $ExpectedStatusKeys = @('do_not_enforce_on_create', 'required_status_checks', 'strict_required_status_checks_policy') | Sort-Object
            $Checks = @($StatusParameters.required_status_checks)
            $Contexts = @($Checks | ForEach-Object { [string]$_.context } | Sort-Object)
            if (($StatusKeys -join '|') -cne ($ExpectedStatusKeys -join '|') -or
                -not $StatusParameters.strict_required_status_checks_policy -or $StatusParameters.do_not_enforce_on_create -or
                $Checks.Count -ne 2 -or ($Contexts -join '|') -cne 'verify (3.10)|verify (3.12)' -or
                @($Checks | Where-Object { [long]$_.integration_id -ne 15368 }).Count -ne 0 -or
                @($Checks | Where-Object { (@($_.PSObject.Properties.Name | Sort-Object) -join '|') -cne 'context|integration_id' }).Count -ne 0) {
              throw 'Exact strict GitHub Actions required-status-check policy drifted.'
            }
          }

          function Assert-TagOnProtectedMain {
            Assert-RepositoryRulesets
            if ((Get-RemoteTagCommit) -cne $env:SOURCE_COMMIT) { throw 'Remote release tag moved.' }
            $Main = Invoke-GitHubJsonRequest -Method 'GET' -Uri "$ApiBase/git/ref/heads/main" -ExpectedStatus @(200)
            if ([string]$Main.ref -cne 'refs/heads/main' -or [string]$Main.object.type -cne 'commit' -or
                [string]$Main.object.sha.ToLowerInvariant() -cne $env:SOURCE_COMMIT) {
              throw 'Release tag is not the exact current protected-main commit.'
            }
          }

          function Upload-OwnedReleaseAsset {
            param(
              [Parameter(Mandatory = $true)][long]$ReleaseId,
              [Parameter(Mandatory = $true)][DateTimeOffset]$CreatedNotBefore,
              [Parameter(Mandatory = $true)][string]$FilePath
            )
            [void](Get-OwnedRelease -ReleaseId $ReleaseId -CreatedNotBefore $CreatedNotBefore -ExpectedVisibility 'draft')
            $File = Get-Item -LiteralPath $FilePath
            $EncodedName = [Uri]::EscapeDataString($File.Name)
            $Response = Invoke-WebRequest -Uri "https://uploads.github.com/repos/$env:GITHUB_REPOSITORY/releases/$ReleaseId/assets?name=$EncodedName" -Method 'POST' -Headers $ApiHeaders -ContentType 'application/octet-stream' -InFile $File.FullName -SkipHttpErrorCheck -TimeoutSec 300
            if ([int]$Response.StatusCode -ne 201) { throw "Exact-ID asset upload returned HTTP $([int]$Response.StatusCode)." }
            try { $Asset = [string]$Response.Content | ConvertFrom-Json } catch { throw 'Exact-ID asset upload returned malformed JSON.' }
            $Digest = 'sha256:' + (Get-FileHash -Algorithm SHA256 -LiteralPath $File.FullName).Hash.ToLowerInvariant()
            $AssetId = [long]$Asset.id
            if ($AssetId -le 0 -or [string]$Asset.url -cne "$ApiBase/releases/assets/$AssetId" -or
                [string]$Asset.name -cne $File.Name -or [string]$Asset.state -cne 'uploaded' -or
                [long]$Asset.size -ne $File.Length -or [string]$Asset.digest -cne $Digest) { throw 'Exact-ID upload response does not bind the local file.' }
          }

          function Assert-RemoteAssets {
            param(
              [Parameter(Mandatory = $true)][long]$ReleaseId,
              [Parameter(Mandatory = $true)][DateTimeOffset]$CreatedNotBefore,
              [Parameter(Mandatory = $true)][string]$Phase,
              [Parameter(Mandatory = $true)][ValidateSet('draft', 'public')][string]$ExpectedVisibility
            )
            $Release = Get-OwnedRelease -ReleaseId $ReleaseId -CreatedNotBefore $CreatedNotBefore -ExpectedVisibility $ExpectedVisibility
            $ExpectedNames = @($env:EXPECTED_ARCHIVE_NAME, "$env:EXPECTED_ARCHIVE_NAME.sha256") | Sort-Object
            $ExpectedDigests = @{
              $env:EXPECTED_ARCHIVE_NAME = "sha256:$env:EXPECTED_ARCHIVE_SHA256"
              "$env:EXPECTED_ARCHIVE_NAME.sha256" = "sha256:$env:EXPECTED_CHECKSUM_SHA256"
            }
            $Assets = @($Release.assets)
            $Names = @($Assets | ForEach-Object { [string]$_.name }) | Sort-Object
            $AssetIds = @($Assets | ForEach-Object { [long]$_.id }) | Sort-Object
            if ($Assets.Count -ne 2 -or (Compare-Object $ExpectedNames $Names) -or
                @($Assets | Where-Object {
                  [long]$_.id -le 0 -or [string]$_.url -cne "$ApiBase/releases/assets/$([long]$_.id)" -or
                  [string]$_.state -cne 'uploaded' -or [string]$_.digest -cne $ExpectedDigests[[string]$_.name]
                }).Count -ne 0) {
              throw "Owned Release asset inventory is invalid during $Phase."
            }
            $RemoteRoot = Join-Path $env:RUNNER_TEMP ("aegis-remote-$Phase-" + [Guid]::NewGuid().ToString('N'))
            try {
              New-Item -ItemType Directory -Path $RemoteRoot | Out-Null
              $DownloadHeaders = $ApiHeaders.Clone()
              $DownloadHeaders['Accept'] = 'application/octet-stream'
              foreach ($Asset in $Assets) {
                $Target = Join-Path $RemoteRoot ([string]$Asset.name)
                $Response = Invoke-WebRequest -Uri ([string]$Asset.url) -Headers $DownloadHeaders -OutFile $Target -PassThru -SkipHttpErrorCheck -TimeoutSec 300
                if ([int]$Response.StatusCode -ne 200) { throw "Exact-ID asset download returned HTTP $([int]$Response.StatusCode) during $Phase." }
              }
              $RemoteArchive = Join-Path $RemoteRoot $env:EXPECTED_ARCHIVE_NAME
              $RemoteChecksum = "$RemoteArchive.sha256"
              if (@(Get-ChildItem -LiteralPath $RemoteRoot -File).Count -ne 2 -or
                  (Get-FileHash -Algorithm SHA256 -LiteralPath $RemoteArchive).Hash.ToLowerInvariant() -cne $env:EXPECTED_ARCHIVE_SHA256 -or
                  (Get-FileHash -Algorithm SHA256 -LiteralPath $RemoteChecksum).Hash.ToLowerInvariant() -cne $env:EXPECTED_CHECKSUM_SHA256 -or
                  (Get-Content -Raw -LiteralPath $RemoteChecksum).Trim() -cne "$env:EXPECTED_ARCHIVE_SHA256  $env:EXPECTED_ARCHIVE_NAME") {
                throw "Remote exact-ID assets differ from the twice-tested inputs during $Phase."
              }
              Assert-ArchiveSignatures -ArchivePath $RemoteArchive -Phase $Phase
              $Confirmed = Get-OwnedRelease -ReleaseId $ReleaseId -CreatedNotBefore $CreatedNotBefore -ExpectedVisibility $ExpectedVisibility
              $ConfirmedNames = @($Confirmed.assets | ForEach-Object { [string]$_.name }) | Sort-Object
              $ConfirmedIds = @($Confirmed.assets | ForEach-Object { [long]$_.id }) | Sort-Object
              if (@($Confirmed.assets).Count -ne 2 -or (Compare-Object $ExpectedNames $ConfirmedNames) -or
                  (Compare-Object $AssetIds $ConfirmedIds) -or
                  @($Confirmed.assets | Where-Object { [string]$_.state -cne 'uploaded' -or [string]$_.digest -cne $ExpectedDigests[[string]$_.name] }).Count -ne 0) {
                throw "Owned Release asset identity changed during $Phase."
              }
            } finally { if (Test-Path -LiteralPath $RemoteRoot) { Remove-Item -LiteralPath $RemoteRoot -Recurse -Force } }
          }

          function Restore-OwnedReleaseToPrivateDraft {
            param(
              [Parameter(Mandatory = $true)][long]$ReleaseId,
              [Parameter(Mandatory = $true)][DateTimeOffset]$CreatedAt,
              [Parameter(Mandatory = $true)][string]$NodeId
            )
            function Assert-ImmutableOwnedIdentity($Release) {
              try {
                $ObservedCreatedAt = [DateTimeOffset]::Parse([string]$Release.created_at, [Globalization.CultureInfo]::InvariantCulture, [Globalization.DateTimeStyles]::AssumeUniversal)
              } catch { throw 'Rollback Release created_at is missing or malformed.' }
              if ([long]$Release.id -ne $ReleaseId -or [string]$Release.node_id -cne $NodeId -or
                  [string]$Release.author.login -cne 'github-actions[bot]' -or
                  [string]$Release.url -cne "$ApiBase/releases/$ReleaseId" -or
                  $ObservedCreatedAt.ToUniversalTime() -ne $CreatedAt.ToUniversalTime()) {
                throw 'Exact-ID rollback immutable ownership proof failed.'
              }
            }
            $Observations = [Collections.Generic.List[string]]::new()
            foreach ($Attempt in 1..4) {
              try {
                $Current = Get-ReleaseByIdOrNull $ReleaseId
                if (-not $Current) { throw "Owned Release ID $ReleaseId no longer exists." }
                Assert-ImmutableOwnedIdentity $Current
                if ($Current.draft -eq $true) {
                  $ConfirmedPrivate = Get-ReleaseByIdOrNull $ReleaseId
                  if (-not $ConfirmedPrivate) { throw "Owned Release ID $ReleaseId disappeared during rollback." }
                  Assert-ImmutableOwnedIdentity $ConfirmedPrivate
                  if ($ConfirmedPrivate.draft -ne $true) { throw 'Exact-ID rollback did not remain private.' }
                  return
                }
                $Patched = Invoke-GitHubJsonRequest -Method 'PATCH' -Uri "$ApiBase/releases/$ReleaseId" -ExpectedStatus @(200) -Body @{ draft = $true }
                Assert-ImmutableOwnedIdentity $Patched
                if ($Patched.draft -ne $true) { throw 'Exact-ID rollback PATCH did not produce a private draft.' }
                $ConfirmedPrivate = Get-ReleaseByIdOrNull $ReleaseId
                if (-not $ConfirmedPrivate) { throw "Owned Release ID $ReleaseId disappeared after rollback." }
                Assert-ImmutableOwnedIdentity $ConfirmedPrivate
                if ($ConfirmedPrivate.draft -ne $true) { throw 'Exact-ID rollback was not confirmed private.' }
                return
              } catch { $Observations.Add("attempt $Attempt`: $($_.Exception.Message)") }
              Start-Sleep -Seconds ([Math]::Pow(2, $Attempt - 1))
            }
            throw "Could not confirm exact-ID private-draft rollback: $($Observations -join '; ')"
          }

          Assert-TagOnProtectedMain
          if (Get-ReleaseByTagOrNull) { throw 'A GitHub Release already exists for this tag.' }
          $CreationWindowStart = [DateTimeOffset]::UtcNow.AddSeconds(-5)
          $OwnedReleaseId = $null
          $OwnedReleaseCreatedAt = $null
          $OwnedReleaseNodeId = $null
          try {
            # This single request is the only operation that may establish ownership.
            # Any exception, non-201 status, missing body or malformed immutable field
            # leaves OwnedReleaseId null: no Release lookup, adoption, PATCH, upload or
            # rollback is permitted after such an ambiguous creation outcome.
            $Created = Invoke-GitHubJsonRequest -Method 'POST' -Uri "$ApiBase/releases" -ExpectedStatus @(201) -Body @{
              tag_name = $env:RELEASE_TAG
              target_commitish = $env:SOURCE_COMMIT
              name = $ExpectedReleaseTitle
              body = $ExpectedReleaseBody
              draft = $true
              prerelease = $false
              generate_release_notes = $false
            }
            $CandidateId = [long]$Created.id
            try {
              $CandidateCreatedAt = [DateTimeOffset]::Parse([string]$Created.created_at, [Globalization.CultureInfo]::InvariantCulture, [Globalization.DateTimeStyles]::AssumeUniversal)
            } catch { throw 'HTTP 201 Release immutable created_at is malformed; ownership was not established and no remote object will be queried or mutated.' }
            $CandidateNodeId = [string]$Created.node_id
            if ($CandidateId -le 0 -or [string]::IsNullOrWhiteSpace($CandidateNodeId) -or
                [string]$Created.url -cne "$ApiBase/releases/$CandidateId" -or
                $CandidateCreatedAt -lt $CreationWindowStart -or $CandidateCreatedAt -gt [DateTimeOffset]::UtcNow.AddMinutes(5)) {
              throw 'HTTP 201 response lacks exact immutable id/node_id/created_at ownership evidence; no remote object will be queried or mutated.'
            }
            $OwnedReleaseCreatedAt = $CandidateCreatedAt
            $OwnedReleaseNodeId = $CandidateNodeId
            $OwnedReleaseId = $CandidateId
            Assert-OwnedRelease -Release $Created -ExpectedId $OwnedReleaseId -CreatedNotBefore $CreationWindowStart -ExpectedVisibility 'draft'
            Upload-OwnedReleaseAsset -ReleaseId $OwnedReleaseId -CreatedNotBefore $CreationWindowStart -FilePath $Archive
            Upload-OwnedReleaseAsset -ReleaseId $OwnedReleaseId -CreatedNotBefore $CreationWindowStart -FilePath $Checksum
            [void](Get-OwnedRelease -ReleaseId $OwnedReleaseId -CreatedNotBefore $CreationWindowStart -ExpectedVisibility 'draft')
            Assert-TagOnProtectedMain
            Assert-RemoteAssets -ReleaseId $OwnedReleaseId -CreatedNotBefore $CreationWindowStart -Phase 'prepublish' -ExpectedVisibility 'draft'
            Assert-TagOnProtectedMain
            $Published = Invoke-GitHubJsonRequest -Method 'PATCH' -Uri "$ApiBase/releases/$OwnedReleaseId" -ExpectedStatus @(200) -Body @{ draft = $false }
            Assert-OwnedRelease -Release $Published -ExpectedId $OwnedReleaseId -CreatedNotBefore $CreationWindowStart -ExpectedVisibility 'public'
            [void](Get-OwnedRelease -ReleaseId $OwnedReleaseId -CreatedNotBefore $CreationWindowStart -ExpectedVisibility 'public')
            Assert-TagOnProtectedMain
            Assert-RemoteAssets -ReleaseId $OwnedReleaseId -CreatedNotBefore $CreationWindowStart -Phase 'postpublish' -ExpectedVisibility 'public'
            Assert-TagOnProtectedMain
            [void](Get-OwnedRelease -ReleaseId $OwnedReleaseId -CreatedNotBefore $CreationWindowStart -ExpectedVisibility 'public')
          } catch {
            $Failure = $_.Exception.Message
            if ($null -ne $OwnedReleaseId) {
              try { Restore-OwnedReleaseToPrivateDraft -ReleaseId $OwnedReleaseId -CreatedAt $OwnedReleaseCreatedAt -NodeId $OwnedReleaseNodeId } catch {
                throw "Publication entered an ambiguous exact-ID state. Original: $Failure. Rollback: $($_.Exception.Message)"
              }
              throw "Publication failed and owned Release ID $OwnedReleaseId was confirmed private: $Failure"
            }
            throw "Publication failed before exact ownership was established; no remote Release was edited: $Failure"
          }
