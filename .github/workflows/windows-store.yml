name: Windows Store gates

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  AEGIS_STORE_PRODUCT_ID: 9NWTH4KJX5GW
  AEGIS_STORE_IDENTITY_NAME: ${{ vars.AEGIS_STORE_IDENTITY_NAME }}
  AEGIS_EXPECTED_STORE_IDENTITY_NAME: LAIZEYU.QuantScenarioStudiobyLAIZEYU
  AEGIS_STORE_PUBLISHER: CN=A5F91D0A-30C6-48EE-944F-B767FA872BE8
  AEGIS_APPROVED_WACK_FILE_VERSION: ${{ vars.AEGIS_APPROVED_WACK_FILE_VERSION }}
  AEGIS_MAIN_RULESET_ID: "21633557"
  AEGIS_PRIVATE_STORE_HANDOFF_ROOT: ${{ vars.AEGIS_PRIVATE_STORE_HANDOFF_ROOT }}

concurrency:
  group: windows-store-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-verify-one-candidate:
    name: Build once, QA twice, WACK twice, retain unsigned handoff privately
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'lzy2767865503-pixel/aegis-forecast' &&
      github.repository_owner == 'lzy2767865503-pixel' &&
      github.actor == 'lzy2767865503-pixel' &&
      github.triggering_actor == 'lzy2767865503-pixel' &&
      github.ref == 'refs/heads/main'
    runs-on: [self-hosted, windows, x64, wack-interactive]
    environment: windows-store-verification
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require trusted main, reserved Partner identity and approved elevated WACK runner
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          if ($env:GITHUB_EVENT_NAME -cne 'workflow_dispatch' -or
              $env:GITHUB_REPOSITORY -cne 'lzy2767865503-pixel/aegis-forecast' -or
              $env:GITHUB_ACTOR -cne 'lzy2767865503-pixel' -or
              $env:GITHUB_TRIGGERING_ACTOR -cne 'lzy2767865503-pixel' -or
              $env:GITHUB_REF -cne 'refs/heads/main') {
            throw 'The interactive WACK runner accepts only an owner-dispatched trusted main checkout.'
          }
          & git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          if ($LASTEXITCODE -ne 0) { throw 'Could not fetch trusted origin/main without credentials.' }
          $HeadCommit = (& git rev-parse HEAD).Trim()
          $MainCommit = (& git rev-parse refs/remotes/origin/main).Trim()
          if ($LASTEXITCODE -ne 0 -or $HeadCommit -cnotmatch '^[0-9a-f]{40}$' -or $HeadCommit -cne $MainCommit) {
            throw 'The WACK checkout is not the exact fetched origin/main commit.'
          }
          if ($env:AEGIS_STORE_PUBLISHER -cne 'CN=A5F91D0A-30C6-48EE-944F-B767FA872BE8') {
            throw 'Partner Center technical Publisher drifted.'
          }
          if ($env:AEGIS_STORE_PRODUCT_ID -cne '9NWTH4KJX5GW' -or
              $env:AEGIS_EXPECTED_STORE_IDENTITY_NAME -cne 'LAIZEYU.QuantScenarioStudiobyLAIZEYU' -or
              $env:AEGIS_STORE_IDENTITY_NAME -cne $env:AEGIS_EXPECTED_STORE_IDENTITY_NAME) {
            throw 'Partner Center Store ID or hard-locked production Identity Name drifted.'
          }
          if ($env:AEGIS_MAIN_RULESET_ID -cne '21633557') { throw 'The protected main ruleset ID drifted.' }
          $Ruleset = & gh api "repos/$env:GITHUB_REPOSITORY/rulesets/$env:AEGIS_MAIN_RULESET_ID" | ConvertFrom-Json
          $Includes = @($Ruleset.conditions.ref_name.include)
          $Excludes = @($Ruleset.conditions.ref_name.exclude)
          $RuleTypes = @($Ruleset.rules | ForEach-Object type | Sort-Object)
          $PullRequestRules = @($Ruleset.rules | Where-Object type -ceq 'pull_request')
          if ($LASTEXITCODE -ne 0 -or [long]$Ruleset.id -ne 21633557 -or $Ruleset.enforcement -cne 'active' -or
              $Ruleset.target -cne 'branch' -or @($Ruleset.bypass_actors).Count -ne 0 -or
              ($Includes -join '|') -cne 'refs/heads/main' -or $Excludes.Count -ne 0 -or
              ($RuleTypes -join '|') -cne 'deletion|non_fast_forward|pull_request' -or $PullRequestRules.Count -ne 1) {
            throw 'The active no-bypass main lineage ruleset is not exact.'
          }
          $Parameters = $PullRequestRules[0].parameters
          $ParameterKeys = @($Parameters.PSObject.Properties.Name | Sort-Object)
          $ExpectedParameterKeys = @(
            'allowed_merge_methods', 'dismiss_stale_reviews_on_push', 'require_code_owner_review',
            'require_extra_approval_for_unattributed_changes', 'require_last_push_approval',
            'required_approving_review_count', 'required_review_thread_resolution', 'required_reviewers'
          ) | Sort-Object
          if (($ParameterKeys -join '|') -cne ($ExpectedParameterKeys -join '|') -or
              (@($Parameters.allowed_merge_methods | Sort-Object) -join '|') -cne 'merge|rebase|squash' -or
              -not $Parameters.dismiss_stale_reviews_on_push -or -not $Parameters.required_review_thread_resolution -or
              $Parameters.require_code_owner_review -or $Parameters.require_extra_approval_for_unattributed_changes -or
              $Parameters.require_last_push_approval -or [int]$Parameters.required_approving_review_count -ne 0 -or
              @($Parameters.required_reviewers).Count -ne 0) {
            throw 'The exact main pull-request/review-thread-resolution policy drifted.'
          }
          . ./scripts/windows/wack-runner-policy.ps1
          [void](Assert-AegisWackRunner -ApprovedFileVersion $env:AEGIS_APPROVED_WACK_FILE_VERSION)

      - name: Fail early unless the local fixed-NTFS handoff root has the exact private ACL
        shell: pwsh
        run: ./scripts/windows/retain-private-store-handoff.ps1 -PrivateRoot $env:AEGIS_PRIVATE_STORE_HANDOFF_ROOT -ValidateOnly

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: 3.13.14
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements.lock.txt
            requirements-windows-build.lock.txt
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 10.34.5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.23.1
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 8.0.424

      - name: Install the pinned Windows toolchain
        shell: pwsh
        run: ./scripts/windows/setup.ps1
      - name: Run source, audit, frontend and frozen-sidecar gates
        shell: pwsh
        run: ./scripts/windows/verify-pass1.ps1

      - name: Create an ephemeral Partner Center technical development certificate
        id: cert
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Set-StrictMode -Version Latest
          $PasswordText = "Aegis-CI-Only-Not-For-Distribution"
          $Password = ConvertTo-SecureString $PasswordText -AsPlainText -Force
          $Subject = $env:AEGIS_STORE_PUBLISHER
          $Stem = "aegis-ci-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $FriendlyName = "Aegis-CI-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $Certificate = New-SelfSignedCertificate -Type Custom -Subject $Subject -FriendlyName $FriendlyName -KeyUsage DigitalSignature -KeyExportPolicy Exportable -KeySpec Signature -HashAlgorithm SHA256 -CertStoreLocation "Cert:\CurrentUser\My" -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}")
          if ($Certificate.Thumbprint -notmatch "^[0-9A-F]{40}$" -or $Certificate.Subject -ne $Subject) { throw "Ephemeral certificate identity is invalid." }
          $Pfx = Join-Path $env:RUNNER_TEMP "$Stem.pfx"
          $Cer = Join-Path $env:RUNNER_TEMP "$Stem.cer"
          $Owner = Join-Path $env:RUNNER_TEMP "$Stem.certificate-owner.json"
          if (Test-Path -LiteralPath $Owner) { throw "Certificate ownership marker must not preexist." }
          [ordered]@{
            schemaVersion = 1
            githubRunId = $env:GITHUB_RUN_ID
            githubRunAttempt = $env:GITHUB_RUN_ATTEMPT
            subject = $Subject
            thumbprint = $Certificate.Thumbprint
          } | ConvertTo-Json -Compress | Set-Content -Encoding utf8 -LiteralPath $Owner
          "pfx=$Pfx" >> $env:GITHUB_OUTPUT
          "cer=$Cer" >> $env:GITHUB_OUTPUT
          "thumbprint=$($Certificate.Thumbprint)" >> $env:GITHUB_OUTPUT
          Export-PfxCertificate -Cert $Certificate -FilePath $Pfx -Password $Password | Out-Null
          Export-Certificate -Cert $Certificate -FilePath $Cer | Out-Null
          Import-Certificate -FilePath $Cer -CertStoreLocation "Cert:\CurrentUser\Root" | Out-Null

      - name: Build the only technical-identity development candidate
        shell: pwsh
        run: >-
          ./scripts/windows/build-msix.ps1
          -CertificatePath '${{ steps.cert.outputs.pfx }}'
          -CertificatePassword 'Aegis-CI-Only-Not-For-Distribution'
          -CertificatePublicPath '${{ steps.cert.outputs.cer }}'
          -StoreIdentityName $env:AEGIS_STORE_IDENTITY_NAME
          -StorePublisher $env:AEGIS_STORE_PUBLISHER

      - name: Native QA round 1 on the original candidate bytes
        shell: pwsh
        run: ./scripts/windows/verify-native.ps1 -MsixPath artifacts/candidate/QuantScenarioStudio_1.5.0.0_x64_signed-dev.msix -CandidateManifestPath artifacts/candidate/candidate.json -CertificatePath artifacts/candidate/QuantScenarioStudio_signed-dev.cer -QaRound 1
      - name: Native QA round 2 on the unchanged candidate bytes
        shell: pwsh
        run: ./scripts/windows/verify-native.ps1 -MsixPath artifacts/candidate/QuantScenarioStudio_1.5.0.0_x64_signed-dev.msix -CandidateManifestPath artifacts/candidate/candidate.json -CertificatePath artifacts/candidate/QuantScenarioStudio_signed-dev.cer -QaRound 2
      - name: Strict WACK round 1 on those same QA bytes
        shell: pwsh
        run: ./scripts/windows/verify-wack.ps1 -MsixPath artifacts/candidate/QuantScenarioStudio_1.5.0.0_x64_signed-dev.msix -CandidateManifestPath artifacts/candidate/candidate.json -CertificatePath artifacts/candidate/QuantScenarioStudio_signed-dev.cer -ApprovedWackFileVersion $env:AEGIS_APPROVED_WACK_FILE_VERSION -WackRound 1
      - name: Strict WACK round 2 on those same QA bytes
        shell: pwsh
        run: ./scripts/windows/verify-wack.ps1 -MsixPath artifacts/candidate/QuantScenarioStudio_1.5.0.0_x64_signed-dev.msix -CandidateManifestPath artifacts/candidate/candidate.json -CertificatePath artifacts/candidate/QuantScenarioStudio_signed-dev.cer -ApprovedWackFileVersion $env:AEGIS_APPROVED_WACK_FILE_VERSION -WackRound 2

      - name: Validate evidence schemas and write a fixed job summary
        shell: pwsh
        run: ./scripts/windows/generate-release-metadata.ps1

      - name: Prepare the unsigned Partner Center handoff from the verified lineage
        shell: pwsh
        run: ./scripts/windows/prepare-store-handoff.ps1

      - name: Retain the unsigned handoff only under the local exact-ACL NTFS boundary
        shell: pwsh
        run: ./scripts/windows/retain-private-store-handoff.ps1 -PrivateRoot $env:AEGIS_PRIVATE_STORE_HANDOFF_ROOT

      - name: Remove only this run's exact certificate-store entries
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Set-StrictMode -Version Latest
          $Thumbprint = '${{ steps.cert.outputs.thumbprint }}'
          $Stem = "aegis-ci-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $FriendlyName = "Aegis-CI-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $OwnerPath = Join-Path $env:RUNNER_TEMP "$Stem.certificate-owner.json"
          if (Test-Path -LiteralPath $OwnerPath) {
            $Owner = Get-Content -Raw -LiteralPath $OwnerPath | ConvertFrom-Json
            $Keys = @($Owner.PSObject.Properties.Name | Sort-Object)
            if (($Keys -join '|') -cne 'githubRunAttempt|githubRunId|schemaVersion|subject|thumbprint' -or
                $Owner.schemaVersion -ne 1 -or $Owner.githubRunId -cne $env:GITHUB_RUN_ID -or
                $Owner.githubRunAttempt -cne $env:GITHUB_RUN_ATTEMPT -or
                $Owner.subject -cne $env:AEGIS_STORE_PUBLISHER -or $Owner.thumbprint -cnotmatch '^[0-9A-F]{40}$') {
              throw "Certificate ownership marker is invalid."
            }
            if ($Thumbprint -and $Thumbprint -cne $Owner.thumbprint) { throw "Certificate output and ownership marker disagree." }
            $Thumbprint = $Owner.thumbprint
          }
          if (-not $Thumbprint) {
            $OwnedCandidates = @(Get-ChildItem Cert:\CurrentUser\My | Where-Object { $_.FriendlyName -ceq $FriendlyName -and $_.Subject -ceq $env:AEGIS_STORE_PUBLISHER })
            if ($OwnedCandidates.Count -gt 1) { throw "More than one exact run-owned development certificate exists." }
            if ($OwnedCandidates.Count -eq 1) { $Thumbprint = $OwnedCandidates[0].Thumbprint }
          }
          if ($Thumbprint) {
            ./scripts/windows/remove-development-certificate.ps1 -Thumbprint $Thumbprint -StoreLocations @("CurrentUser\My", "CurrentUser\Root", "CurrentUser\TrustedPeople")
          }

      - name: Remove only this run's certificate files and private work products
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          Set-StrictMode -Version Latest
          $Errors = [Collections.Generic.List[string]]::new()
          $RunnerTemp = [System.IO.Path]::GetFullPath($env:RUNNER_TEMP).TrimEnd("\") + "\"
          $Stem = "aegis-ci-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          foreach ($Path in @(
            (Join-Path $env:RUNNER_TEMP "$Stem.pfx"),
            (Join-Path $env:RUNNER_TEMP "$Stem.cer"),
            (Join-Path $env:RUNNER_TEMP "$Stem.certificate-owner.json")
          )) {
            try {
              if ([string]::IsNullOrWhiteSpace($Path)) { continue }
              $Exact = [System.IO.Path]::GetFullPath($Path)
              if (-not $Exact.StartsWith($RunnerTemp, [StringComparison]::OrdinalIgnoreCase)) { throw "Refusing to delete a certificate file outside RUNNER_TEMP." }
              if (Test-Path -LiteralPath $Exact) {
                $Item = Get-Item -LiteralPath $Exact -Force
                if (($Item.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) { throw "Certificate work product is a reparse point." }
                Remove-Item -LiteralPath $Exact -Force -ErrorAction Stop
              }
              if (Test-Path -LiteralPath $Exact) { throw "Certificate work product remained after cleanup." }
            } catch { $Errors.Add("$Path`: $($_.Exception.Message)") }
          }
          foreach ($Relative in @(
            "artifacts\backend", "artifacts\candidate", "artifacts\msix-build", "artifacts\pyinstaller",
            "artifacts\qa", "artifacts\wack", "artifacts\private-summary", "artifacts\_manifest",
            "artifacts\store-handoff", "artifacts\test-logs"
          )) {
            try {
              $Exact = [System.IO.Path]::GetFullPath((Join-Path $PWD $Relative))
              $Artifacts = [System.IO.Path]::GetFullPath((Join-Path $PWD "artifacts")).TrimEnd("\") + "\"
              if (-not $Exact.StartsWith($Artifacts, [StringComparison]::OrdinalIgnoreCase)) { throw "Refusing to delete outside artifacts." }
              if (Test-Path -LiteralPath $Exact) {
                $Item = Get-Item -LiteralPath $Exact -Force
                $Reparse = @(Get-ChildItem -LiteralPath $Exact -Force -Recurse -ErrorAction Stop | Where-Object { ($_.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0 })
                if (($Item.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0 -or $Reparse.Count -ne 0) { throw "Artifact cleanup tree contains a reparse point." }
                Remove-Item -LiteralPath $Exact -Recurse -Force -ErrorAction Stop
              }
              if (Test-Path -LiteralPath $Exact) { throw "Artifact work product remained after cleanup." }
            } catch { $Errors.Add("$Relative`: $($_.Exception.Message)") }
          }
          if ($Errors.Count -ne 0) { throw "Store work-product cleanup failures: $($Errors -join ' | ')" }
