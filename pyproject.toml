[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-forecast"
version = "1.4.0"
description = "A privacy-safe, simulation-only Nasdaq-100 technical research workstation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "LAI ZEYU" },
]
dependencies = [
  "numpy>=2.0,<3.0",
  "pandas>=2.2,<3.0",
]

[project.optional-dependencies]
moomoo = ["moomoo-api>=10.9"]
dev = ["pytest>=8.0"]

[project.scripts]
aegis-forecast = "aegis_quant.cli:main"

[tool.setuptools]
package-dir = { "" = "backend" }

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["backend", "."]
